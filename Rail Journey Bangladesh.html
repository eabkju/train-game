<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rail Journey Bangladesh — Rural Village 3D Train Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap">
<style>
:root {
  --green: #14683d;
  --light-green: #2e8b57;
  --dark-green: #082818;
  --cream: #f5f2ea;
  --yellow: #f0b323;
  --red: #c8312b;
  --panel: rgba(14, 22, 18, 0.92);
  --border: rgba(255, 255, 255, 0.25);
  --ink: #eaf3ed;
  --font-main: 'Hind Siliguri', 'Anek Bangla', system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: #050b08; color: var(--ink); font-family: var(--font-main);
  user-select: none; -webkit-user-select: none;
}

#app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; }
#gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }

/* Top Left Telemetry HUD */
.top-card {
  position: fixed; top: max(12px, env(safe-area-inset-top)); left: 14px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  pointer-events: auto; z-index: 100000;
}
.brand-flag {
  width: 28px; height: 18px; background: var(--green); border-radius: 3px; position: relative; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.brand-flag::after {
  content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%;
  background: var(--red); left: 9.5px; top: 4.5px;
}
.speed-wrap { display: flex; align-items: baseline; gap: 4px; }
.speed-val { font-family: var(--mono); font-size: 34px; font-weight: 800; line-height: 1; color: #fff; }
.speed-unit { font-size: 11px; text-transform: uppercase; color: #8ea899; font-weight: 700; }
.station-cluster { border-left: 1px solid rgba(255,255,255,0.18); padding-left: 14px; }
.station-main { font-size: 15px; font-weight: 700; color: #fff; }
.station-sub { font-size: 12px; color: #9bb5a5; font-family: var(--mono); }

/* Satellite Status Badge */
.sat-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 6px; background: rgba(20,104,61,0.35); border: 1px solid rgba(63,224,149,0.4);
  color: #3fe095; margin-top: 3px;
}
.sat-dot { width: 6px; height: 6px; border-radius: 50%; background: #3fe095; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Top Right Weather & Atmosphere Presets */
.weather-dock {
  position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 6px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  pointer-events: auto; z-index: 100000;
}
.btn-weath {
  padding: 7px 11px; border-radius: 10px; border: 1px solid transparent;
  background: rgba(255,255,255,0.06); color: #a5bfb0; font-size: 12px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
}
.btn-weath:hover { background: rgba(255,255,255,0.14); color: #fff; }
.btn-weath.active {
  background: var(--green); border-color: #3fe095; color: #fff;
  box-shadow: 0 0 12px rgba(63,224,149,0.35);
}

/* Bottom Left: Route Selector */
.route-dock {
  position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 14px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 8px 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  pointer-events: auto; z-index: 100000;
}
.route-select {
  background: rgba(0,0,0,0.45); color: #fff; border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700;
  outline: none; cursor: pointer; font-family: var(--font-main);
}
.route-select option { background: #0c1a14; color: #fff; }

/* =========================================================================
   RIGHT HORIZONTAL GAME CONTROLS (ALWAYS VISIBLE & ACCESSIBLE)
   ========================================================================= */
.right-ctrl-dock {
  position: fixed;
  bottom: max(16px, env(safe-area-inset-bottom, 16px));
  right: max(16px, env(safe-area-inset-right, 16px));
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 10px 16px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.75);
  pointer-events: auto;
  z-index: 100000;
  max-width: calc(100vw - 32px);
}

/* Big Start / Stop Button */
.btn-play-pause {
  height: 48px; padding: 0 20px; border-radius: 14px; border: 0;
  background: linear-gradient(135deg, #18985f, #0d633d); color: #fff;
  font-family: var(--font-main); font-size: 15px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 6px 20px rgba(20,104,61,0.5); transition: all 0.15s ease;
  white-space: nowrap; flex-shrink: 0;
}
.btn-play-pause.stopped {
  background: linear-gradient(135deg, #d3352d, #9c1b15);
  box-shadow: 0 6px 20px rgba(211,53,45,0.5);
}
.btn-play-pause:hover { filter: brightness(1.12); transform: translateY(-1px); }
.btn-play-pause:active { transform: translateY(1px); }
.btn-play-pause svg { width: 20px; height: 20px; fill: currentColor; }

/* Horn Button */
.btn-horn {
  height: 48px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--yellow);
  background: radial-gradient(circle at 35% 35%, #ffd257, #cb8900); color: #2e1a00;
  font-family: var(--font-main); font-size: 14px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  box-shadow: 0 6px 20px rgba(240,179,35,0.4); transition: transform 0.08s, filter 0.08s;
  white-space: nowrap; flex-shrink: 0;
}
.btn-horn:active, .btn-horn.active { transform: scale(0.94); filter: brightness(1.2); }
.btn-horn svg { width: 20px; height: 20px; fill: currentColor; }

/* Speed Multipliers */
.speed-group {
  display: flex; gap: 4px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.speed-multi-btn {
  padding: 6px 9px; border-radius: 6px; border: 0;
  background: transparent; color: #a5bfb0; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; font-family: var(--mono);
}
.speed-multi-btn.active { background: var(--green); color: #fff; }

/* Camera Controls Inside Horizontal Dock */
.cam-group {
  display: flex; gap: 4px; border-left: 1px solid rgba(255,255,255,0.15); padding-left: 8px;
  flex-shrink: 0;
}
.btn-cam-h {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.06); color: #fff; display: grid; place-items: center;
  cursor: pointer; transition: all 0.15s;
}
.btn-cam-h:hover { border-color: var(--yellow); background: rgba(255,255,255,0.12); }
.btn-cam-h:active { transform: scale(0.92); }
.btn-cam-h svg { width: 18px; height: 18px; fill: currentColor; }

/* Interactive Drag Hint (Fades out) */
.drag-hint {
  position: fixed; top: 82px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.72); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
  padding: 6px 18px; font-size: 12px; font-weight: 600; color: #d0e4d8;
  backdrop-filter: blur(8px); pointer-events: none; z-index: 100000;
  transition: opacity 1.5s ease;
}

@media (max-width: 900px) {
  .right-ctrl-dock {
    padding: 6px 10px; gap: 6px; border-radius: 16px;
    bottom: max(10px, env(safe-area-inset-bottom, 10px));
    right: max(10px, env(safe-area-inset-right, 10px));
  }
  .btn-play-pause { height: 42px; padding: 0 14px; font-size: 13px; }
  .btn-horn { height: 42px; padding: 0 12px; font-size: 12px; }
  .speed-multi-btn { padding: 4px 6px; font-size: 11px; }
  .btn-cam-h { width: 34px; height: 34px; }
  .route-dock { display: none; }
}

@media (max-width: 600px) {
  .right-ctrl-dock {
    transform-origin: bottom right;
    transform: scale(0.92);
  }
  .top-card { padding: 8px 12px; gap: 10px; }
  .speed-val { font-size: 26px; }
  .weather-dock { padding: 4px; gap: 4px; }
  .btn-weath { padding: 5px 7px; font-size: 11px; }
}
</style>
</head>
<body>

<div id="app">
  <!-- 3D WebGL Canvas -->
  <div id="view"><canvas id="gl"></canvas></div>

  <!-- Interactive 360 Drag Hint -->
  <div class="drag-hint" id="dragHint">👆 Drag 360° to Orbit · Scroll / Pinch to Zoom</div>

  <!-- Top Left: Speed & Telemetry HUD -->
  <div class="top-card">
    <div class="brand-flag" title="বাংলাদেশ রেলওয়ে"></div>
    <div class="speed-wrap">
      <span class="speed-val" id="hudSpeed">0</span>
      <span class="speed-unit">km/h</span>
    </div>
    <div class="station-cluster">
      <div class="station-main" id="hudStation">Dhaka Kamalapur · ঢাকা কমলাপুর</div>
      <div class="station-sub" id="hudNext">Next: Airport · 16.5 km</div>
      <div class="sat-badge" id="hudSatStatus"><span class="sat-dot"></span> Google Satellite: Active</div>
    </div>
  </div>

  <!-- Top Right: Weather Presets -->
  <div class="weather-dock">
    <button class="btn-weath active" data-w="day">☀️ Day</button>
    <button class="btn-weath" data-w="sunset">🌅 Sunset</button>
    <button class="btn-weath" data-w="rain">🌧️ Rain</button>
    <button class="btn-weath" data-w="fog">🌫️ Fog</button>
    <button class="btn-weath" data-w="night">🌙 Night</button>
  </div>

  <!-- Bottom Left: Route Selector -->
  <div class="route-dock">
    <select class="route-select" id="routeSelect">
      <option value="bogura" selected>Dhaka → Bogura (১৯৫ কিমি)</option>
      <option value="pabna">Dhaka → Pabna (১৮০ কিমি)</option>
    </select>
  </div>

  <!-- =========================================================================
       RIGHT HORIZONTAL GAME CONTROLS (Always Visible in Display Area)
       ========================================================================= -->
  <div class="right-ctrl-dock">
    <button class="btn-play-pause" id="btnPlayPause">
      <svg id="iconPause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      <svg id="iconPlay" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
      <span id="txtPlayPause">STOP TRAIN</span>
    </button>

    <button class="btn-horn" id="btnHorn">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <span>HORN / বাঁশি</span>
    </button>

    <div class="speed-group">
      <button class="speed-multi-btn active" id="btnSpeed1x">1×</button>
      <button class="speed-multi-btn" id="btnSpeed3x">3×</button>
      <button class="speed-multi-btn" id="btnSpeed8x">8×</button>
    </div>

    <div class="cam-group">
      <button class="btn-cam-h" id="btnZoomIn" title="Zoom in (+)">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <button class="btn-cam-h" id="btnZoomOut" title="Zoom out (−)">
        <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>
      <button class="btn-cam-h" id="btnRecenter" title="Recenter Camera (C)">
        <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Local Three.js with CDN fallback -->
<script src="three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
}
</script>

<script>
(function(){
'use strict';

/* =========================================================================
   1. GEOGRAPHY & TRACK COORDINATES (BANGLADESH RAILWAY NETWORK)
   ========================================================================= */
var LAT0 = 23.733, LON0 = 90.426, KX = 111320 * Math.cos(24.3 * Math.PI / 180), KZ = 110574;
function proj(lat, lon) { return [(lon - LON0) * KX, -(lat - LAT0) * KZ]; }
function unproj(x, z) { return [LAT0 - z / KZ, LON0 + x / KX]; }

var W = {
  kam:   { n: 'Dhaka Kamalapur', bn: 'ঢাকা কমলাপুর', ll: [23.7330, 90.4260], stop: true },
  v1:    { ll: [23.7900, 90.4120] },
  air:   { n: 'Dhaka Airport',   bn: 'বিমানবন্দর',     ll: [23.8517, 90.4080], stop: true },
  tongi: { n: 'Tongi Junction',  bn: 'টঙ্গী জংশন',    ll: [23.8950, 90.4040], stop: true },
  joy:   { n: 'Joydebpur',       bn: 'জয়দেবপুর',      ll: [24.0000, 90.4200], stop: true },
  v2:    { ll: [24.0450, 90.2600] },
  mirz:  { n: 'Mirzapur',        bn: 'মির্জাপুর',      ll: [24.1019, 90.0969], stop: true },
  tang:  { n: 'Tangail',         bn: 'টাঙ্গাইল',       ll: [24.2510, 89.9167], stop: true },
  v3:    { ll: [24.3300, 89.8750] },
  bbe:   { n: 'Bangabandhu Bridge East', bn: 'বঙ্গবন্ধু সেতু পূর্ব', ll: [24.3950, 89.7900], stop: true, bridge: 'start' },
  bbw:   { ll: [24.4050, 89.7435], bridge: 'end' },
  ull:   { n: 'Ullapara',        bn: 'উল্লাপাড়া',     ll: [24.3130, 89.5600], stop: true },
  vb1:   { ll: [24.5500, 89.4300] },
  bog:   { n: 'Bogura',          bn: 'বগুড়া',         ll: [24.8480, 89.3730], stop: true },
  vp1:   { ll: [24.1500, 89.4000] },
  pab:   { n: 'Pabna',           bn: 'পাবনা',          ll: [24.0030, 89.2330], stop: true }
};

var ROUTES = {
  bogura: ['kam','v1','air','tongi','joy','v2','mirz','tang','v3','bbe','bbw','ull','vb1','bog'],
  pabna:  ['kam','v1','air','tongi','joy','v2','mirz','tang','v3','bbe','bbw','ull','vp1','pab']
};

function mulberry(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function controlPoints(id) {
  var keys = ROUTES[id], rnd = mulberry(id === 'pabna' ? 7 : 3), pts = [], meta = [], i, k;
  for (i = 0; i < keys.length; i++) {
    var w = W[keys[i]], p = proj(w.ll[0], w.ll[1]);
    if (i > 0) {
      var wp = W[keys[i - 1]], pp = proj(wp.ll[0], wp.ll[1]);
      var dx = p[0] - pp[0], dz = p[1] - pp[1], len = Math.hypot(dx, dz);
      var straight = (wp.bridge === 'start');
      var n = straight ? 0 : Math.floor(len / 3200);
      var nx = -dz / len, nz = dx / len;
      for (k = 1; k <= n; k++) {
        var t = k / (n + 1), env = Math.min(1, Math.min(t, 1 - t) * 5);
        var off = (rnd() * 2 - 1) * 230 * env;
        pts.push([pp[0] + dx * t + nx * off, pp[1] + dz * t + nz * off]);
        meta.push(null);
      }
    }
    pts.push(p);
    meta.push(w.stop ? keys[i] : (w.bridge ? { b: w.bridge } : null));
    if (w.bridge && w.stop) meta[meta.length - 1] = { st: keys[i], b: w.bridge };
  }
  return { pts: pts, meta: meta };
}

/* =========================================================================
   2. THREE.JS ENGINE SETUP
   ========================================================================= */
var canvas = document.getElementById('gl');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x73b2dd, 1);
var DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);

var scene = new THREE.Scene();
var FOGC = new THREE.Color(0xdbe8df);
scene.fog = new THREE.Fog(FOGC, 400, 3600);

var camera = new THREE.PerspectiveCamera(46, 1, 1, 40000);
var hemiLight = new THREE.HemisphereLight(0xe8f2ff, 0x5a6d4d, 0.95);
scene.add(hemiLight);

var sunLight = new THREE.DirectionalLight(0xfff2d8, 0.95);
sunLight.position.set(300, 500, 180);
scene.add(sunLight);

/* High-Intensity Forward Headlight */
var locoHeadlight = new THREE.SpotLight(0xfffae6, 3.8, 340, Math.PI / 7.5, 0.4, 1.1);
locoHeadlight.position.set(0, 3.2, 10);
var locoHeadlightTarget = new THREE.Object3D();
locoHeadlightTarget.position.set(0, 1, 80);
scene.add(locoHeadlightTarget);
locoHeadlight.target = locoHeadlightTarget;
scene.add(locoHeadlight);

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* =========================================================================
   3. ROCK-SOLID, NON-FLICKERING TERRAIN SYSTEM
   Eliminates all Z-fighting and frame-by-frame mesh churning.
   ========================================================================= */
// Create a rich, high-resolution procedural Bengal Rural Landscape Canvas
function createRuralBengalTexture() {
  var c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
  var g = c.getContext('2d');
  var rnd = mulberry(101);

  // Deep verdant base
  g.fillStyle = '#225026'; g.fillRect(0, 0, 1024, 1024);

  // Agricultural patchwork of paddy & mustard fields (Ref 1.jpg & 2.jpg)
  for (var i = 0; i < 90; i++) {
    var px = rnd() * 1024, py = rnd() * 1024, pw = 70 + rnd() * 140, ph = 60 + rnd() * 120;
    var hue = rnd() > 0.65 ? '#9ea02c' : (rnd() > 0.35 ? '#1a5c24' : '#5c7425');
    g.fillStyle = hue;
    g.fillRect(px, py, pw, ph);
    g.strokeStyle = 'rgba(20,40,20,0.5)'; g.lineWidth = 2.5;
    g.strokeRect(px, py, pw, ph);
  }

  // Meandering silt water canals
  for (var k = 0; k < 3; k++) {
    g.strokeStyle = '#28464e'; g.lineWidth = 18 + rnd() * 20; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(rnd() * 300, 0);
    g.bezierCurveTo(rnd() * 1024, 300, rnd() * 1024, 700, rnd() * 1024, 1024);
    g.stroke();
  }

  // Earthen village footpaths
  for (var p = 0; p < 8; p++) {
    g.strokeStyle = '#7c6d54'; g.lineWidth = 4 + rnd() * 3;
    g.beginPath();
    g.moveTo(rnd() * 1024, rnd() * 1024);
    g.lineTo(rnd() * 1024, rnd() * 1024);
    g.stroke();
  }

  var t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(24, 24);
  t.anisotropy = 4;
  return t;
}

// Stable unified ground mesh (No overlapping planes -> ZERO FLICKERING)
var groundTex = createRuralBengalTexture();
var groundMat = new THREE.MeshLambertMaterial({ map: groundTex, depthWrite: true });
var ground = new THREE.Mesh(new THREE.PlaneGeometry(90000, 90000), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.0;
scene.add(ground);

// Throttled Satellite Layer (Only updates when moved > 250m)
var lastSatCheckPos = { x: -99999, z: -99999 };
var texLoader = new THREE.TextureLoader();
texLoader.crossOrigin = 'anonymous';

function checkGoogleSatUpdate(cx, cz) {
  var dist = Math.hypot(cx - lastSatCheckPos.x, cz - lastSatCheckPos.z);
  if (dist < 250) return;
  lastSatCheckPos.x = cx; lastSatCheckPos.z = cz;

  var curGeo = unproj(cx, cz);
  var z = 14, nZ = Math.pow(2, z);
  var tx = Math.floor((curGeo[1] + 180) / 360 * nZ);
  var latRad = curGeo[0] * Math.PI / 180;
  var ty = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * nZ);

  var srv = Math.abs((tx + ty) % 4);
  var url = 'https://mt' + srv + '.google.com/vt/lyrs=s&x=' + tx + '&y=' + ty + '&z=' + z;

  texLoader.load(url, function(liveTex) {
    liveTex.wrapS = THREE.RepeatWrapping; liveTex.wrapT = THREE.RepeatWrapping;
    liveTex.repeat.set(18, 18);
    groundMat.map = liveTex;
    groundMat.needsUpdate = true;
    document.getElementById('hudSatStatus').innerHTML = '<span class="sat-dot"></span> Google Satellite: Live';
  }, undefined, function() {
    document.getElementById('hudSatStatus').innerHTML = '<span class="sat-dot" style="background:#f0b323"></span> Rural Bengal (High-Def)';
  });
}

/* =========================================================================
   4. TRACK, ELEVATION & BRIDGES (With Distinct Non-Overlapping Heights)
   ========================================================================= */
var R = null, routeGroup = null, curRouteId = 'bogura';
var CAR_LEN = 16.5;
var NUM_CARS = 3;
var TRAIN_LEN = NUM_CARS * CAR_LEN + (NUM_CARS - 1) * 0.8;
var DS = 6;

function smooth(a, b, x) {
  var t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function buildRoute(id) {
  var cp = controlPoints(id), keys = ROUTES[id], i;
  var vecs = cp.pts.map(function(p) { return new THREE.Vector3(p[0], 0, p[1]); });
  var curve = new THREE.CatmullRomCurve3(vecs, false, 'centripetal');
  curve.arcLengthDivisions = 24000;
  var total = curve.getLength();
  var N = Math.max(10, Math.round(total / DS));
  var sp = curve.getSpacedPoints(N);
  var ds = total / N;
  var X = new Float32Array(N + 1), Y = new Float32Array(N + 1), Z = new Float32Array(N + 1);
  var TX = new Float32Array(N + 1), TZ = new Float32Array(N + 1);

  for (i = 0; i <= N; i++) { X[i] = sp[i].x; Z[i] = sp[i].z; }
  for (i = 0; i <= N; i++) {
    var a = Math.max(0, i - 1), b = Math.min(N, i + 1), dx = X[b] - X[a], dz = Z[b] - Z[a], l = Math.hypot(dx, dz) || 1;
    TX[i] = dx / l; TZ[i] = dz / l;
  }

  function arcOf(x, z) {
    var best = 1e18, bi = 0;
    for (var j = 0; j <= N; j++) {
      var d = (X[j] - x) * (X[j] - x) + (Z[j] - z) * (Z[j] - z);
      if (d < best) { best = d; bi = j; }
    }
    return bi * ds;
  }

  var stops = [], sb0 = null, sb1 = null;
  for (i = 0; i < keys.length; i++) {
    var w = W[keys[i]], p = proj(w.ll[0], w.ll[1]);
    if (w.stop) stops.push({ key: keys[i], name: w.n, bn: w.bn, s: arcOf(p[0], p[1]) });
    if (w.bridge === 'start') sb0 = arcOf(p[0], p[1]);
    if (w.bridge === 'end') sb1 = arcOf(p[0], p[1]);
  }

  var H = 13.5, sbs = sb0 + 900;
  for (i = 0; i <= N; i++) {
    var s = i * ds, e = smooth(sbs - 700, sbs, s) * (1 - smooth(sb1, sb1 + 700, s)) * H;
    Y[i] = e;
  }

  var lim = new Float32Array(N + 1);
  for (i = 0; i <= N; i++) {
    var s2 = i * ds, v = 28.0;
    if (s2 < 9000) v = 15.0;
    if (s2 > sb0 - 1000 && s2 < sb1 + 1000) v = 8.5;
    lim[i] = v;
  }

  var pe = proj(W.bbe.ll[0], W.bbe.ll[1]), pw = proj(W.bbw.ll[0], W.bbw.ll[1]);
  var river = { xw: Math.min(pe[0], pw[0]) - 80, xe: Math.max(pe[0], pw[0]) + 80, zb: (pe[1] + pw[1]) / 2 };

  return { id: id, N: N, ds: ds, total: total, X: X, Y: Y, Z: Z, TX: TX, TZ: TZ, stops: stops, lim: lim, sb0: sb0, sbs: sbs, sb1: sb1, river: river };
}

function posAt(r, s, o) {
  if (s < 0) s = 0; if (s > r.total) s = r.total;
  var f = s / r.ds, i = Math.min(r.N - 1, Math.floor(f)), t = f - i;
  o.x = r.X[i] + (r.X[i + 1] - r.X[i]) * t;
  o.y = r.Y[i] + (r.Y[i + 1] - r.Y[i]) * t;
  o.z = r.Z[i] + (r.Z[i + 1] - r.Z[i]) * t;
  return o;
}
function dirAt(r, s, o) {
  if (s < 0) s = 0; if (s > r.total) s = r.total;
  var f = s / r.ds, i = Math.min(r.N - 1, Math.floor(f)), t = f - i;
  var x = r.TX[i] + (r.TX[i + 1] - r.TX[i]) * t, z = r.TZ[i] + (r.TZ[i + 1] - r.TZ[i]) * t, l = Math.hypot(x, z) || 1;
  o.x = x / l; o.z = z / l;
  return o;
}

function ribbonMesh(r, halfW, off, yOff) {
  var n = r.N + 1, pos = new Float32Array(n * 6), idx = new Uint32Array((n - 1) * 6);
  for (var i = 0; i < n; i++) {
    var rx = -r.TZ[i], rz = r.TX[i], cx = r.X[i] + rx * off, cz = r.Z[i] + rz * off, y = r.Y[i] + yOff;
    pos[i * 6]     = cx - rx * halfW; pos[i * 6 + 1] = y; pos[i * 6 + 2] = cz - rz * halfW;
    pos[i * 6 + 3] = cx + rx * halfW; pos[i * 6 + 4] = y; pos[i * 6 + 5] = cz + rz * halfW;
    if (i < n - 1) {
      var a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3, j = i * 6;
      idx[j] = a; idx[j + 1] = c; idx[j + 2] = b; idx[j + 3] = b; idx[j + 4] = c; idx[j + 5] = d;
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeBoundingSphere();
  return g;
}

  g.arcTo(x + w, y + h, x, y + h, rr); g.arcTo(x, y + h, x, y, rr);
  g.arcTo(x, y, x + w, y, rr); g.closePath(); g.fill();
  g.lineWidth = 8; g.strokeStyle = '#14683d'; g.stroke();

  g.fillStyle = '#c8312b'; g.beginPath(); g.arc(52, 100, 16, 0, Math.PI * 2); g.fill();

function buildStations(r) {

function buildBridgePiers(r) {
  var count = Math.max(1, Math.floor((r.sb1 - r.sbs) / 75));

var envGroup = null;

function buildEnvironment(r) {

  var rnd = mulberry(777);

  // 1. Telegraph & Utility Poles Along Track

    var pz = tmp.z + (dir.x) * 6.5 * side;

    oP.position.set(px, tmp.y + 4.25, pz);

    poleM.setMatrixAt(p, oP.matrix);

    oA.rotation.set(0, Math.atan2(dir.x, dir.z), 0);
    oA.updateMatrix();
    armM.setMatrixAt(p, oA.matrix);

    for (var k = -1; k <= 1; k += 2) {
      oI.position.set(px + (-dir.z) * 0.9 * k, tmp.y + 7.95, pz + dir.x * 0.9 * k);
      oI.updateMatrix();
      insM.setMatrixAt(insIdx++, oI.matrix);
    }
  }
  poleM.instanceMatrix.needsUpdate = true;
  armM.instanceMatrix.needsUpdate = true;
  insM.instanceMatrix.needsUpdate = true;

    oBT.updateMatrix();
    bTrunkM.setMatrixAt(bIdx, oBT.matrix);

    oBL.position.set(bx, tmp.y + 8.5, bz);
    oBL.scale.set(1.1, 0.75, 1.1);
    oBL.updateMatrix();
    bLeafM.setMatrixAt(bIdx, oBL.matrix);
  }
  bTrunkM.instanceMatrix.needsUpdate = true;
  bLeafM.instanceMatrix.needsUpdate = true;
  grp.add(bTrunkM, bLeafM);

  // 6. Lush Banana Plants & Green Bushes (কলা গাছ ও ঝোপঝাড়)
  var bushCount = 500;
  var bushGeo = new THREE.SphereGeometry(1.6, 7, 7);
  var bushMat = new THREE.MeshLambertMaterial({ color: 0x327838 });
  var bushM = new THREE.InstancedMesh(bushGeo, bushMat, bushCount);
  var oB = new THREE.Object3D();

  for (var bu = 0; bu < bushCount; bu++) {
    var sbu = rnd() * r.total;
    posAt(r, sbu, tmp); dirAt(r, sbu, dir);
    var buOff = (rnd() > 0.5 ? 1 : -1) * (7 + rnd() * 35);
    oB.position.set(tmp.x + (-dir.z) * buOff, tmp.y + 0.9, tmp.z + (dir.x) * buOff);
    oB.scale.set(0.9 + rnd() * 0.7, 0.7 + rnd() * 0.5, 0.9 + rnd() * 0.7);
    oB.updateMatrix();
    bushM.setMatrixAt(bu, oB.matrix);
  }
  bushM.instanceMatrix.needsUpdate = true;
  grp.add(bushM);

  // 7. Village Ponds (পুকুর / ডোবা) Along Tracks
  var pondCount = 18;
  var pondMat = new THREE.MeshLambertMaterial({ color: 0x244a4e, depthWrite: true });
  var ghatMat = new THREE.MeshLambertMaterial({ color: 0x5a4430 });

  for (var pd = 0; pd < pondCount; pd++) {
    var spd = 200 + pd * 720 + (rnd() - 0.5) * 150;
    if (spd > r.total - 100) break;
    posAt(r, spd, tmp); dirAt(r, spd, dir);

    var pondG = new THREE.Group();
    // Oval reflective water plane (Elevated slightly to eliminate z-fighting)
    var pPlane = new THREE.Mesh(new THREE.PlaneGeometry(28, 18), pondMat);
    pPlane.rotation.x = -Math.PI / 2;
    pPlane.position.y = 0.08;
    pondG.add(pPlane);

    // Wooden Ghat bathing steps
    var ghat = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.25, 4.2), ghatMat);
    ghat.position.set(0, 0.16, 9.2);
    pondG.add(ghat);

    var pDist = (24 + rnd() * 15) * (rnd() > 0.5 ? 1 : -1);
    pondG.position.set(tmp.x + (-dir.z) * pDist, tmp.y, tmp.z + (dir.x) * pDist);
    pondG.rotation.y = rnd() * Math.PI * 2;
    grp.add(pondG);
  }

  // 8. Railway Multi-Aspect Signals
  signalLamps = [];
  var sigMastGeo = new THREE.CylinderGeometry(0.14, 0.14, 6.2, 8);
  var sigHeadGeo = new THREE.BoxGeometry(0.7, 1.6, 0.35);
  var sigDarkMat = new THREE.MeshLambertMaterial({ color: 0x222222 });

  r.stops.forEach(function(st, idx) {
    if (idx === 0) return;
    var sigS = Math.max(0, st.s - 380);
    posAt(r, sigS, tmp); dirAt(r, sigS, dir);

    var sigG = new THREE.Group();
    var mast = new THREE.Mesh(sigMastGeo, sigDarkMat); mast.position.y = 3.1; sigG.add(mast);
    var head = new THREE.Mesh(sigHeadGeo, sigDarkMat); head.position.set(0, 5.2, 0); sigG.add(head);

    var redMat   = new THREE.MeshBasicMaterial({ color: 0x200505 });
    var yelMat   = new THREE.MeshBasicMaterial({ color: 0x201505 });
    var grnMat   = new THREE.MeshBasicMaterial({ color: 0x33ff55 });
    var redLamp = new THREE.Mesh(new THREE.CircleGeometry(0.18, 12), redMat); redLamp.position.set(0, 5.6, 0.18); sigG.add(redLamp);
    var yelLamp = new THREE.Mesh(new THREE.CircleGeometry(0.18, 12), yelMat); yelLamp.position.set(0, 5.2, 0.18); sigG.add(yelLamp);
    var grnLamp = new THREE.Mesh(new THREE.CircleGeometry(0.18, 12), grnMat); grnLamp.position.set(0, 4.8, 0.18); sigG.add(grnLamp);

    sigG.position.set(tmp.x + (-dir.z) * 3.4, tmp.y, tmp.z + (dir.x) * 3.4);
    sigG.rotation.y = Math.atan2(dir.x, dir.z);
    grp.add(sigG);

    signalLamps.push({ s: sigS, red: redMat, yel: yelMat, grn: grnMat });
  });

  // 9. Level Crossings with Barriers, CNGs & Rickshaws
  var crossingStops = [r.stops[1], r.stops[Math.floor(r.stops.length / 2)]];
  crossingStops.forEach(function(st) {
    if (!st) return;
    var crS = st.s - 120;
    posAt(r, crS, tmp); dirAt(r, crS, dir);

    var crG = new THREE.Group();
    var road = new THREE.Mesh(new THREE.PlaneGeometry(8, 22), new THREE.MeshLambertMaterial({ color: 0x353839 }));
    road.rotation.x = -Math.PI / 2; road.rotation.z = Math.PI / 2;
    road.position.y = 0.52; crG.add(road);

    var barrierMat = new THREE.MeshLambertMaterial({ color: 0xdd2222 });
    var bar1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, 9), barrierMat); bar1.position.set(4.5, 1.4, 0); crG.add(bar1);
    var bar2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, 9), barrierMat); bar2.position.set(-4.5, 1.4, 0); crG.add(bar2);

    var cng = new THREE.Group();
    var cngBody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 2.4), new THREE.MeshLambertMaterial({ color: 0x1d7e48 }));
    cngBody.position.y = 0.9; cng.add(cngBody);
    var cngRoof = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.2, 2.42), new THREE.MeshLambertMaterial({ color: 0xe6b800 }));
    cngRoof.position.y = 1.55; cng.add(cngRoof);
    cng.position.set(6.8, 0.5, 3.2); cng.rotation.y = Math.PI / 2;
    crG.add(cng);

    var rick = new THREE.Group();
    var rickFrame = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.8, 1.8), new THREE.MeshLambertMaterial({ color: 0x111111 }));
    rickFrame.position.y = 0.7; rick.add(rickFrame);
    var rickHood = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.7, 0.8), new THREE.MeshLambertMaterial({ color: 0x3377dd }));
    rickHood.position.set(0, 1.2, -0.4); rick.add(rickHood);
    rick.position.set(-6.8, 0.5, -3.2); rick.rotation.y = -Math.PI / 2;
    crG.add(rick);

    crG.position.set(tmp.x, tmp.y, tmp.z);
    crG.rotation.y = Math.atan2(dir.x, dir.z);
    grp.add(crG);
  });

  // 10. Jamuna River Wooden Country Boats
  var boatCount = 14;
  var boatMat = new THREE.MeshLambertMaterial({ color: 0x3d2719 });
  var chhoiMat = new THREE.MeshLambertMaterial({ color: 0xc49e66 });

  for (var b = 0; b < boatCount; b++) {
    var boat = new THREE.Group();
    var hull = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.4, 9, 8), boatMat);
    hull.rotation.z = Math.PI / 2; hull.scale.set(0.7, 1, 1.6);
    boat.add(hull);

    var chhoi = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 4.2, 8, 1, false, 0, Math.PI), chhoiMat);
    chhoi.rotation.z = Math.PI / 2; chhoi.position.set(0, 0.5, 0);
    boat.add(chhoi);

    var bX = r.river.xw + rnd() * (r.river.xe - r.river.xw);
    var bZ = r.river.zb + (rnd() - 0.5) * 3500;
    boat.position.set(bX, 0.25, bZ);
    boat.rotation.y = rnd() * Math.PI * 2;
    grp.add(boat);
  }

  return grp;
}

    g.fillStyle = 'rgba(255, 235, 160, 0.45)';
    g.fillRect(wx + 6, 62, 96, 60);

    g.fillStyle = '#a0acb2'; g.fillRect(wx + 52, 60, 4, 64);

    g.fillStyle = 'rgba(255, 255, 255, 0.55)';

    g.fillStyle = '#f5c824'; g.fillRect(dx, 204, 76, 4);
  });

  var t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

function createFrontFaceTex(stName) {
  var c = document.createElement('canvas'); c.width = 512; c.height = 512;

  g.fillStyle = '#3a3f42'; g.fillRect(0, 0, 512, 130);
  g.fillStyle = '#f5f2ea'; g.fillRect(0, 130, 512, 160);

  g.closePath(); g.fill();

  g.fillStyle = '#f0b323';
  g.beginPath();
  g.moveTo(0, 280); g.lineTo(256, 310); g.lineTo(512, 280); g.lineTo(512, 292); g.lineTo(256, 322); g.lineTo(0, 292);
  g.closePath(); g.fill();

  // Slanted Windshields
  for (var w = 0; w < 2; w++) {

    g.beginPath();
    g.roundRect ? g.roundRect(wx, 142, 186, 136, 16) : g.fillRect(wx, 142, 186, 136);

    g.fillStyle = '#72a8be';
    g.beginPath();

    g.fill();

    g.fillStyle = 'rgba(255, 235, 160, 0.4)';
    g.fillRect(wx + 8, 150, 170, 120);

    g.strokeStyle = '#181818'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(wx + 30, 265); g.lineTo(wx + 105, 195); g.stroke();
  }

  // Illuminated Rollsign Destination Box
  g.fillStyle = '#181e1a'; g.fillRect(160, 72, 192, 48);
  g.fillStyle = '#fffbe8'; g.fillRect(164, 76, 184, 40);
  g.fillStyle = '#0f2418';
  g.font = 'bold 24px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(stName || 'Dhaka · ঢাকা', 256, 96);

  // Sealed-Beam Headlights
  for (var h = 0; h < 2; h++) {
    var hx = 95 + h * 322, hy = 360;
    g.fillStyle = '#b4beba'; g.beginPath(); g.arc(hx, hy, 38, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fffae0'; g.beginPath(); g.arc(hx, hy, 28, 0, Math.PI * 2); g.fill();

    var mx = (h === 0 ? hx - 42 : hx + 42), my = hy + 38;
    g.fillStyle = '#b4beba'; g.beginPath(); g.arc(mx, my, 18, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#d32f2f'; g.beginPath(); g.arc(mx, my, 13, 0, Math.PI * 2); g.fill();
  }

  g.fillStyle = '#1c1c1c'; g.fillRect(190, 435, 132, 77);

  var t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

var cars = [], wheels = [];

function addDetailedBogie(grp, z) {
  var bFrame = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.65, 4.4), bogieMat);
  bFrame.position.set(0, 0.68, z); grp.add(bFrame);

  var springMat = new THREE.MeshLambertMaterial({ color: 0x485250 });
  for (var sx = -1; sx <= 1; sx += 2) {
    var spring = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.55, 8), springMat);
    spring.position.set(sx * 1.25, 0.72, z);

      var w = new THREE.Mesh(wheelGeo, wheelMat);

      grp.add(w); wheels.push(w);

function buildTrain() {
  cars.forEach(function(c) { scene.remove(c); });
  cars = []; wheels = [];

  wheelGeo = new THREE.CylinderGeometry(0.46, 0.46, 0.16, 12);
  wheelGeo.rotateZ(Math.PI / 2);
  wheelMat = new THREE.MeshStandardMaterial({ color: 0x24282c, metalness: 0.85, roughness: 0.35 });
  bogieMat = new THREE.MeshLambertMaterial({ color: 0x262b2e });

  var darkMat  = new THREE.MeshLambertMaterial({ color: 0x222426 });
  var roofMat  = new THREE.MeshLambertMaterial({ color: 0x3a3f42 });
  var couplerMat = new THREE.MeshLambertMaterial({ color: 0x181818 });

  var sideCabTex   = createTrainSideTex(true);
  var sideCoachTex = createTrainSideTex(false);
  var frontTexLead = createFrontFaceTex('Dhaka · ঢাকা');
  var frontTexRear = createFrontFaceTex('Bogura · বগুড়া');

  var matSideCab   = new THREE.MeshLambertMaterial({ map: sideCabTex });
  var matSideCoach = new THREE.MeshLambertMaterial({ map: sideCoachTex });
  var matFrontLead = new THREE.MeshLambertMaterial({ map: frontTexLead });
  var matFrontRear = new THREE.MeshLambertMaterial({ map: frontTexRear });

  for (var k = 0; k < NUM_CARS; k++) {
    var isLead = (k === 0);
    var isRear = (k === NUM_CARS - 1);
    var isCab = isLead || isRear;

    var carGrp = new THREE.Group();

    var sideMat = isCab ? matSideCab : matSideCoach;
    var frontFaceMat = isLead ? matFrontLead : (isRear ? matFrontRear : darkMat);
    var backFaceMat  = isRear ? matFrontRear : darkMat;

    var bodyMatArray = [
      sideMat, sideMat,
      roofMat, darkMat,
      (isLead ? frontFaceMat : darkMat),
      (isRear ? backFaceMat : darkMat)
    ];

    var body = new THREE.Mesh(new THREE.BoxGeometry(3.05, 3.1, CAR_LEN), bodyMatArray);
    body.position.set(0, 2.45, 0);
    carGrp.add(body);

    var roofArch = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, CAR_LEN - 0.2, 14, 1, false, 0, Math.PI), roofMat);
    roofArch.rotation.z = Math.PI / 2;
    roofArch.position.set(0, 3.92, 0);
    roofArch.scale.set(0.65, 1, 1);
    carGrp.add(roofArch);

    var acGeo = new THREE.BoxGeometry(1.8, 0.35, 2.8);
    var ac1 = new THREE.Mesh(acGeo, darkMat); ac1.position.set(0, 4.38, -4.5); carGrp.add(ac1);
    var ac2 = new THREE.Mesh(acGeo, darkMat); ac2.position.set(0, 4.38,  4.5); carGrp.add(ac2);

    if (isLead) {
      var hlGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.22, 12);
      hlGeo.rotateX(Math.PI / 2);
      var chromeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });
      var hlLensMat = new THREE.MeshBasicMaterial({ color: 0xfffae6 });

      var hlLeft = new THREE.Mesh(hlGeo, chromeMat); hlLeft.position.set(-0.95, 2.25, CAR_LEN / 2 + 0.1); carGrp.add(hlLeft);
      var hlRight = new THREE.Mesh(hlGeo, chromeMat); hlRight.position.set(0.95, 2.25, CAR_LEN / 2 + 0.1); carGrp.add(hlRight);
      var lensL = new THREE.Mesh(new THREE.CircleGeometry(0.22, 10), hlLensMat); lensL.position.set(-0.95, 2.25, CAR_LEN / 2 + 0.22); carGrp.add(lensL);
      var lensR = new THREE.Mesh(new THREE.CircleGeometry(0.22, 10), hlLensMat); lensR.position.set( 0.95, 2.25, CAR_LEN / 2 + 0.22); carGrp.add(lensR);

      var coupler = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.8), couplerMat);
      coupler.position.set(0, 0.65, CAR_LEN / 2 + 0.4);
      carGrp.add(coupler);

      var ant = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.45, 0.18), darkMat);
      ant.position.set(0.65, 4.45, CAR_LEN / 2 - 1.2);
      ant.rotation.x = -0.25;
      carGrp.add(ant);
    }

    if (isRear) {
      var couplerR = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.8), couplerMat);
      couplerR.position.set(0, 0.65, -CAR_LEN / 2 - 0.4);
      carGrp.add(couplerR);
    }

    if (!isLead) {
      var bellowF = new THREE.Mesh(new THREE.BoxGeometry(1.65, 2.6, 0.8), darkMat);
      bellowF.position.set(0, 2.3, CAR_LEN / 2 + 0.4);
      carGrp.add(bellowF);
    }

    var fuelTank = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 5.2, 10), darkMat);
    fuelTank.rotation.z = Math.PI / 2;
    fuelTank.position.set(0, 0.82, 0);
    carGrp.add(fuelTank);

    addDetailedBogie(carGrp, -5.2);
    addDetailedBogie(carGrp,  5.2);

    carGrp.userData = { len: CAR_LEN, bog: 5.2 };
    cars.push(carGrp);
  }

  cars.forEach(function(c) { scene.add(c); });
}

/* =========================================================================
   7. PROCEDURAL WEB AUDIO
   ========================================================================= */
var Aud = (function() {
  var ctx = null, master, comp;
  var osc1, osc2, engFilter, engAmp, lfo, lfoG, turbo, turboG, wheel, wheelG, wind, windG, rumG;
  var rainNoise, rainG;
  var hornG, hornOsc1, hornOsc2;

  function noiseBuf() {
    var b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function wheelBuf() {
    var sr = ctx.sampleRate, len = Math.floor(sr * 1.2), b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0);
    var hits = [0, 0.14, 0.6, 0.74];
    hits.forEach(function(t, idx) {
      var st = Math.floor(t * sr), L = Math.floor(sr * 0.09), lpv = 0;
      for (var k = 0; k < L && st + k < len; k++) {
        var e = Math.exp(-k / (sr * 0.018)), n = Math.random() * 2 - 1;
        lpv += (n - lpv) * 0.25;
        d[st + k] += (lpv * 0.9 + Math.sin(2 * Math.PI * 85 * k / sr) * 0.5) * e * (idx % 2 ? 0.7 : 1);
      }
    });
    return b;
  }

  return {
    init: function() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();

      comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
      master = ctx.createGain(); master.gain.value = 0.92; master.connect(comp);

      osc1 = ctx.createOscillator(); osc1.type = 'sawtooth'; osc1.frequency.value = 32;
      osc2 = ctx.createOscillator(); osc2.type = 'sawtooth'; osc2.frequency.value = 48;
      engFilter = ctx.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.frequency.value = 240; engFilter.Q.value = 2.5;
      engAmp = ctx.createGain(); engAmp.gain.value = 0.15;

      lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 8;
      lfoG = ctx.createGain(); lfoG.gain.value = 0.06;
      lfo.connect(lfoG); lfoG.connect(engAmp.gain);

      var mix = ctx.createGain(); mix.gain.value = 0.5;
      osc1.connect(mix); osc2.connect(mix); mix.connect(engFilter); engFilter.connect(engAmp); engAmp.connect(master);
      osc1.start(); osc2.start(); lfo.start();

      var nb = noiseBuf();
      var ts = ctx.createBufferSource(); ts.buffer = nb; ts.loop = true;
      var tf = ctx.createBiquadFilter(); tf.type = 'bandpass'; tf.frequency.value = 1900; tf.Q.value = 8;
      turboG = ctx.createGain(); turboG.gain.value = 0.005;
      ts.connect(tf); tf.connect(turboG); turboG.connect(master); ts.start();

      wheel = ctx.createBufferSource(); wheel.buffer = wheelBuf(); wheel.loop = true;
      var wheelHP = ctx.createBiquadFilter(); wheelHP.type = 'highpass'; wheelHP.frequency.value = 65;
      wheelG = ctx.createGain(); wheelG.gain.value = 0;
      wheel.connect(wheelHP); wheelHP.connect(wheelG); wheelG.connect(master); wheel.start();

      rainNoise = ctx.createBufferSource(); rainNoise.buffer = nb; rainNoise.loop = true;
      var rainFilter = ctx.createBiquadFilter(); rainFilter.type = 'lowpass'; rainFilter.frequency.value = 1400;
      rainG = ctx.createGain(); rainG.gain.value = 0;
      rainNoise.connect(rainFilter); rainFilter.connect(rainG); rainG.connect(master); rainNoise.start();

      var ws = ctx.createBufferSource(); ws.buffer = nb; ws.loop = true;
      var wf = ctx.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 800;
      windG = ctx.createGain(); windG.gain.value = 0;
      ws.connect(wf); wf.connect(windG); windG.connect(master); ws.start();

      var rs = ctx.createBufferSource(); rs.buffer = nb; rs.loop = true;
      var rf = ctx.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 110;
      rumG = ctx.createGain(); rumG.gain.value = 0;
      rs.connect(rf); rf.connect(rumG); rumG.connect(master); rs.start();
    },

    update: function(v, isRunning, inBridge, isRain) {
      if (!ctx) return;
      var t = ctx.currentTime, sp = Math.min(v, 32);
      var thr = isRunning ? Math.min(1.0, 0.15 + sp / 28) : 0;

      osc1.frequency.setTargetAtTime(32 + thr * 45, t, 0.15);
      osc2.frequency.setTargetAtTime(48 + thr * 68, t, 0.15);
      engFilter.frequency.setTargetAtTime(200 + thr * 650, t, 0.15);
      engAmp.gain.setTargetAtTime(isRunning ? 0.10 + 0.18 * thr : 0.05, t, 0.12);
      lfo.frequency.setTargetAtTime(6 + thr * 16, t, 0.15);

      turboG.gain.setTargetAtTime(isRunning && sp > 4 ? 0.02 + thr * 0.04 : 0.002, t, 0.1);
      wheel.playbackRate.setTargetAtTime(Math.max(0.01, sp / 13.5), t, 0.05);
      wheelG.gain.setTargetAtTime(Math.min(0.85, sp / 15), t, 0.1);
      windG.gain.setTargetAtTime(Math.min(0.2, sp / 140), t, 0.2);
      rumG.gain.setTargetAtTime(Math.min(0.45, sp / 35) + (inBridge ? 0.4 : 0), t, 0.2);

      rainG.gain.setTargetAtTime(isRain ? 0.22 : 0, t, 0.3);
    },

    horn: function(active) {
      if (!ctx) return;
      var t = ctx.currentTime;
      if (active) {
        if (!hornG) {
          hornG = ctx.createGain(); hornG.gain.setValueAtTime(0, t);
          var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800;
          hornOsc1 = ctx.createOscillator(); hornOsc1.type = 'sawtooth'; hornOsc1.frequency.value = 349;
          hornOsc2 = ctx.createOscillator(); hornOsc2.type = 'sawtooth'; hornOsc2.frequency.value = 440;
          hornOsc1.connect(f); hornOsc2.connect(f); f.connect(hornG); hornG.connect(master);
          hornOsc1.start(); hornOsc2.start();
        }
        hornG.gain.linearRampToValueAtTime(0.38, t + 0.05);
      } else {
        if (hornG) {
          hornG.gain.linearRampToValueAtTime(0, t + 0.12);
          setTimeout(function() {
            if (hornOsc1) { hornOsc1.stop(); hornOsc2.stop(); hornOsc1 = null; hornOsc2 = null; hornG = null; }
          }, 150);
        }
      }
    },

    airHiss: function() {
      if (!ctx) return;
      var t = ctx.currentTime, s = ctx.createBufferSource(); s.buffer = noiseBuf();
      var f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2800;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.04); g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 1.5);
    }
  };
})();

/* =========================================================================
   8. AUTOMATIC SIMULATION & MOVEMENT STATE
   ========================================================================= */
var run = {
  moving: true,
  s: 0,
  v: 0,
  acc: 0,
  phase: 'go',
  dwellTime: 0,
  nextStopIdx: 1,
  speedMultiplier: 1.0,
  hornedAtStop: false
};

function resetRun() {
  run.s = R.stops[0].s + TRAIN_LEN / 2;
  run.v = 0; run.acc = 0; run.phase = 'go'; run.dwellTime = 0;
  run.nextStopIdx = 1; run.hornedAtStop = false;
}

function stopTarget(idx) {
  return R.stops[idx].s + TRAIN_LEN / 2;
}

function updateAutoMovement(dt) {
  if (!run.moving) {
    if (run.v > 0) { run.v = Math.max(0, run.v - 2.5 * dt); }
    return;
  }

  if (run.phase === 'dwell') {
    run.dwellTime += dt;
    run.v = 0; run.acc = 0;
    if (run.dwellTime > 4 && !run.hornedAtStop) {
      run.hornedAtStop = true;
      Aud.horn(true); setTimeout(function() { Aud.horn(false); }, 750);
    }
    if (run.dwellTime >= 8) {
      run.phase = 'go'; run.dwellTime = 0; run.hornedAtStop = false;
    }
    return;
  }

  var idx = Math.max(0, Math.min(R.N, Math.round(run.s / R.ds)));
  var speedLimit = R.lim[idx];
  var distToNext = stopTarget(run.nextStopIdx) - run.s;

  speedLimit = Math.min(speedLimit, Math.sqrt(2 * 0.45 * Math.max(distToNext - 2, 0)) + 0.6);

  var a;
  if (run.v < speedLimit) {
    a = 0.65 * (1 - Math.pow(run.v / (speedLimit * 1.05), 2));
  } else {
    a = -Math.min(0.85, (run.v - speedLimit) * 1.5 + 0.15);
  }

  var nv = Math.max(0, run.v + a * dt);
  run.acc = (nv - run.v) / Math.max(dt, 1e-4);
  run.v = nv;
  run.s += run.v * dt;

  if (signalLamps) {
    signalLamps.forEach(function(sig) {
      var dS = sig.s - run.s;
      if (dS > 0 && dS < 350) {
        sig.grn.color.setHex(0x05200a); sig.yel.color.setHex(0xffcc00); sig.red.color.setHex(0x200505);
      } else if (dS <= 0 && dS > -150) {
        sig.grn.color.setHex(0x05200a); sig.yel.color.setHex(0x201505); sig.red.color.setHex(0xff2222);
      } else {
        sig.grn.color.setHex(0x33ff55); sig.yel.color.setHex(0x201505); sig.red.color.setHex(0x200505);
      }
    });
  }

  if (distToNext < 320 && distToNext > 280 && !run.hornedAtStop && run.v > 6) {
    run.hornedAtStop = true;
    Aud.horn(true); setTimeout(function() { Aud.horn(false); }, 900);
  }

  distToNext = stopTarget(run.nextStopIdx) - run.s;
  if (distToNext <= 1.0 || (distToNext < 5 && run.v < 0.6)) {
    run.s = stopTarget(run.nextStopIdx);
    run.v = 0; run.acc = 0;
    run.phase = 'dwell'; run.dwellTime = 0; run.hornedAtStop = false;
    Aud.airHiss();
    if (run.nextStopIdx < R.stops.length - 1) {
      run.nextStopIdx++;
    } else {
      run.nextStopIdx = 0;
    }
  }
}

/* =========================================================================
   9. 360° ROTATABLE & ZOOMABLE EXTERIOR ORBIT CAMERA
   ========================================================================= */
var orbit = {
  D: 85,
  tD: 85,
  az: Math.PI * 0.95,
  el: 0.35,
  minD: 15,
  maxD: 850
};

var pHead = { x: 0, y: 0, z: 0 }, dHead = { x: 0, z: 0 };
var tgt = new THREE.Vector3();

function updateCamera(dt) {
  orbit.D += (orbit.tD - orbit.D) * (1 - Math.exp(-dt * 8));

  posAt(R, run.s - TRAIN_LEN * 0.45, pHead);
  dirAt(R, run.s - TRAIN_LEN * 0.45, dHead);

  tgt.set(pHead.x, pHead.y + 2.4, pHead.z);

  var ce = Math.cos(orbit.el), se = Math.sin(orbit.el);
  camera.position.set(
    tgt.x - Math.sin(orbit.az) * ce * orbit.D,
    tgt.y + se * orbit.D,
    tgt.z - Math.cos(orbit.az) * ce * orbit.D
  );
  camera.lookAt(tgt);

  locoHeadlight.position.set(pHead.x, pHead.y + 2.5, pHead.z);
  locoHeadlightTarget.position.set(pHead.x + dHead.x * 65, pHead.y + 0.5, pHead.z + dHead.z * 65);

  // Center ground around camera target without moving vertical position
  ground.position.set(tgt.x, 0.0, tgt.z);

  // Throttled Satellite Update (no flickering!)
  checkGoogleSatUpdate(tgt.x, tgt.z);

  if (rainParticles.visible) {
    rainParticles.position.set(camera.position.x, 0, camera.position.z);
    var posArr = rainParticles.geometry.attributes.position.array;
    for (var i = 0; i < rainCount; i++) {
      posArr[i * 3 + 1] -= dt * 65;
      if (posArr[i * 3 + 1] < 0) posArr[i * 3 + 1] = 80;
    }
    rainParticles.geometry.attributes.position.needsUpdate = true;
  }
}

/* =========================================================================
   10. TRAIN MODEL UPDATES & SLEEPERS
   ========================================================================= */
var pF = { x: 0, y: 0, z: 0 }, pR = { x: 0, y: 0, z: 0 }, v3 = new THREE.Vector3();
var rollAngle = 0;

function updateTrainMesh(dt) {
  var c = run.s - CAR_LEN * 0.5;
  for (var i = 0; i < cars.length; i++) {
    var car = cars[i];
    var half = car.userData.bog;
    posAt(R, c + half, pF); posAt(R, c - half, pR);
    car.position.set((pF.x + pR.x) / 2, (pF.y + pR.y) / 2 + 0.65, (pF.z + pR.z) / 2);
    v3.set(pF.x, pF.y + 0.65, pF.z);
    car.lookAt(v3);
    c -= (CAR_LEN + 0.8);
  }
  rollAngle += run.v * dt / 0.46;
  for (var w = 0; w < wheels.length; w++) wheels[w].rotation.x = rollAngle;
}

function updateSleepers() {
  if (!sleepers) return;
  var n0 = Math.floor((run.s - 180) / 0.7);
  var p = { x: 0, y: 0, z: 0 }, d = { x: 0, z: 0 };
  for (var i = 0; i < SLEEPERS; i++) {
    var s = (n0 + i) * 0.7;
    if (s < 0 || s > R.total) {
      dummy.scale.set(0, 0, 0); dummy.position.set(0, -99, 0);
    } else {
      posAt(R, s, p); dirAt(R, s, d);
      dummy.position.set(p.x, p.y + 0.58, p.z);
      dummy.rotation.set(0, Math.atan2(d.x, d.z), 0);
      dummy.scale.set(1, 1, 1);
    }
    dummy.updateMatrix();
    sleepers.setMatrixAt(i, dummy.matrix);
  }
  sleepers.instanceMatrix.needsUpdate = true;
}

/* =========================================================================
   11. INTERACTIVE CONTROLS (RIGHT HORIZONTAL DOCK, HORN, 360 DRAG, ZOOM)
   ========================================================================= */
var btnPlayPause = document.getElementById('btnPlayPause');
var iconPlay = document.getElementById('iconPlay'), iconPause = document.getElementById('iconPause');
var txtPlayPause = document.getElementById('txtPlayPause');

function togglePlayPause() {
  Aud.init();
  run.moving = !run.moving;
  if (run.moving) {
    btnPlayPause.classList.remove('stopped');
    iconPause.style.display = 'block'; iconPlay.style.display = 'none';
    txtPlayPause.textContent = 'STOP TRAIN';
    Aud.airHiss();
  } else {
    btnPlayPause.classList.add('stopped');
    iconPause.style.display = 'none'; iconPlay.style.display = 'block';
    txtPlayPause.textContent = 'START TRAIN';
    Aud.airHiss();
  }
}
btnPlayPause.addEventListener('click', togglePlayPause);

// Horn Control
var btnHorn = document.getElementById('btnHorn');
function startHorn() { Aud.init(); Aud.horn(true); btnHorn.classList.add('active'); }
function stopHorn()  { Aud.horn(false); btnHorn.classList.remove('active'); }
btnHorn.addEventListener('mousedown', startHorn);
btnHorn.addEventListener('mouseup', stopHorn);
btnHorn.addEventListener('touchstart', function(e) { e.preventDefault(); startHorn(); });
btnHorn.addEventListener('touchend', stopHorn);

// Zoom Controls
function zoom(factor) {
  orbit.tD = Math.min(orbit.maxD, Math.max(orbit.minD, orbit.tD * factor));
}
document.getElementById('btnZoomIn').addEventListener('click', function() { zoom(0.75); });
document.getElementById('btnZoomOut').addEventListener('click', function() { zoom(1 / 0.75); });
document.getElementById('btnRecenter').addEventListener('click', function() {
  orbit.tD = 85; orbit.az = Math.PI * 0.95; orbit.el = 0.35;
});

// Speed Multipliers
function setSpeedMulti(m, btn) {
  run.speedMultiplier = m;
  document.querySelectorAll('.speed-multi-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
document.getElementById('btnSpeed1x').addEventListener('click', function() { setSpeedMulti(1.0, this); });
document.getElementById('btnSpeed3x').addEventListener('click', function() { setSpeedMulti(3.0, this); });
document.getElementById('btnSpeed8x').addEventListener('click', function() { setSpeedMulti(8.0, this); });

// Weather buttons
document.querySelectorAll('.btn-weath').forEach(function(b) {
  b.addEventListener('click', function() {
    Aud.init();
    setWeather(this.getAttribute('data-w'));
  });
});

// Route selector
document.getElementById('routeSelect').addEventListener('change', function() {
  setRoute(this.value);
  resetRun();
});

// 360° Touch and Mouse Drag Rotate + Pinch Zoom
var ptrs = {}, pinch = 0;
canvas.addEventListener('pointerdown', function(e) {
  Aud.init();
  canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  pinch = 0;
  var hint = document.getElementById('dragHint');
  if (hint) { hint.style.opacity = '0'; setTimeout(function() { hint.remove(); }, 1500); }
});

canvas.addEventListener('pointermove', function(e) {
  var p = ptrs[e.pointerId];
  if (!p) return;
  var ids = Object.keys(ptrs);

  if (ids.length === 2) {
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var a = ptrs[ids[0]], b = ptrs[ids[1]], dd = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch > 0 && dd > 0) {
      orbit.tD = Math.min(orbit.maxD, Math.max(orbit.minD, orbit.tD * (pinch / dd)));
    }
    pinch = dd;
    return;
  }

  var dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;

  orbit.az -= dx * 0.007;
  orbit.el = Math.max(0.08, Math.min(1.45, orbit.el + dy * 0.007));
});

function endPointer(e) { delete ptrs[e.pointerId]; pinch = 0; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  zoom(Math.exp(e.deltaY * 0.0012));
}, { passive: false });

window.addEventListener('keydown', function(e) {
  if (e.key === ' ' || e.key === 'h' || e.key === 'H') { startHorn(); }
  else if (e.key === '+' || e.key === '=') { zoom(0.8); }
  else if (e.key === '-' || e.key === '_') { zoom(1 / 0.8); }
  else if (e.key === 'c' || e.key === 'C') { document.getElementById('btnRecenter').click(); }
  else if (e.key === 'p' || e.key === 'P') { togglePlayPause(); }
});
window.addEventListener('keyup', function(e) {
  if (e.key === ' ' || e.key === 'h' || e.key === 'H') { stopHorn(); }
});

/* =========================================================================
   12. TELEMETRY HUD & MAIN ANIMATION LOOP
   ========================================================================= */
var hudSpeed = document.getElementById('hudSpeed');
var hudStation = document.getElementById('hudStation');
var hudNext = document.getElementById('hudNext');

function updateHUD() {
  var kmh = Math.round(run.v * 3.6);
  hudSpeed.textContent = kmh;

  var currentStop = R.stops[Math.max(0, run.nextStopIdx - 1)];
  var nextStop = R.stops[Math.min(run.nextStopIdx, R.stops.length - 1)];
  var distKm = Math.max(0, (stopTarget(run.nextStopIdx) - run.s) / 1000).toFixed(1);

  if (run.phase === 'dwell') {
    hudStation.textContent = 'At: ' + currentStop.name + ' · ' + currentStop.bn;
    hudNext.textContent = 'Boarding passengers...';
  } else {
    hudStation.textContent = currentStop.name + ' → ' + nextStop.name;
    hudNext.textContent = 'Next: ' + nextStop.name + ' (' + nextStop.bn + ') · ' + distKm + ' km';
  }
}

var lastTime = performance.now();
function loop(now) {
  var dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  updateAutoMovement(dt * run.speedMultiplier);
  updateTrainMesh(dt * run.speedMultiplier);
  updateSleepers();
  updateCamera(dt);
  updateHUD();

  var inBridge = (run.s > R.sb0 && run.s < R.sb1);
  Aud.update(run.v, run.moving, inBridge, curWeather === 'rain');

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// Bootstrap
setWeather('day');
setRoute('bogura');
buildTrain();
resetRun();
requestAnimationFrame(loop);

})();
</script>
