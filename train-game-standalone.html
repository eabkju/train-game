<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#080f1a">
    <title>Realistic 3D Web Train Simulation — Cool CPU Edition</title>
    <style>
/* style.css - Ultra-lightweight, responsive glassmorphic HUD, draggable 3-button dock, and camera navigation */
:root {
  --bg-glass: rgba(12, 20, 32, 0.78);
  --bg-glass-hover: rgba(22, 36, 56, 0.88);
  --border-glass: rgba(255, 255, 255, 0.16);
  --accent-cyan: #38bdf8;
  --accent-gold: #facc15;
  --accent-amber: #f59e0b;
  --accent-green: #22c55e;
  --accent-emerald: #10b981;
  --accent-red: #ef4444;
  --text-primary: #f8fafc;
  --text-muted: #94a3b8;
  --shadow-dock: 0 14px 32px rgba(0, 0, 0, 0.45);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #0b1524;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text-primary);
}

#canvas-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  touch-action: none;
  cursor: grab;
}

#canvas-container:active {
  cursor: grabbing;
}

canvas {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

/* =========================================================
   TOP STATUS HUD (Time of Day, Rain, CPU Eco, Camera, Speed)
   ========================================================= */
#top-hud {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 8px 14px;
  max-width: calc(100vw - 24px);
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-glass);
  border-radius: 9999px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
  pointer-events: auto;
}

.hud-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: 9999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
  white-space: nowrap;
}

.hud-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.28);
  transform: translateY(-1px);
}

.hud-btn:active {
  transform: scale(0.96);
}

.hud-btn.active {
  background: rgba(56, 189, 248, 0.24);
  border-color: var(--accent-cyan);
  color: #e0f2fe;
}

.hud-btn.eco-active {
  background: rgba(16, 185, 129, 0.22);
  border-color: var(--accent-emerald);
  color: #d1fae5;
}

.hud-divider {
  width: 1px;
  height: 20px;
  background: var(--border-glass);
}

#speed-gauge {
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-weight: 800;
  padding: 0 6px;
}

#speed-gauge-val {
  font-size: 19px;
  color: var(--accent-gold);
  font-variant-numeric: tabular-nums;
  min-width: 24px;
  text-align: right;
}

#speed-gauge-unit {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
}

/* Telemetry Pill (Top Right or Bottom Left) */
#perf-pill {
  position: absolute;
  bottom: 18px;
  left: 18px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg-glass);
  border: 1px solid var(--border-glass);
  border-radius: 12px;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}

.perf-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-emerald);
  box-shadow: 0 0 8px var(--accent-emerald);
}

/* =========================================================
   LEFT-SIDE CAMERA CONTROLS (+, -, Recenter, Camera Mode)
   ========================================================= */
#left-camera-hud {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 8px;
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-glass);
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  pointer-events: auto;
}

.cam-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--text-primary);
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
}

.cam-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.32);
  transform: scale(1.05);
}

.cam-btn:active {
  transform: scale(0.94);
  background: rgba(56, 189, 248, 0.3);
}

/* =========================================================
   THE 3 CONTROLLERS DOCK (Start/Stop, Horn, Light + Throttle)
   ========================================================= */
#train-controls-dock {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 18px;
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1.5px solid var(--border-glass);
  border-radius: 24px;
  box-shadow: var(--shadow-dock);
  cursor: grab;
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
  touch-action: none;
}

#train-controls-dock:active {
  cursor: grabbing;
}

#train-controls-dock.dragging-mode {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.4), 0 20px 40px rgba(0, 0, 0, 0.6);
}

.drag-grip-indicator {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 4px;
  opacity: 0.45;
}

.grip-bar {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-primary);
}

.ctrl-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 88px;
  height: 80px;
  border-radius: 18px;
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  position: relative;
  overflow: hidden;
}

.ctrl-btn .btn-icon {
  font-size: 24px;
  margin-bottom: 2px;
}

.ctrl-btn .btn-label {
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.ctrl-btn .btn-sub {
  font-size: 9.5px;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 2px;
}

.ctrl-btn:hover {
  background: var(--bg-glass-hover);
  border-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

.ctrl-btn:active {
  transform: scale(0.94);
}

/* 1. START / STOP Dynamic Styling */
#btn-start-stop {
  background: linear-gradient(145deg, rgba(34, 197, 94, 0.24), rgba(16, 80, 40, 0.4));
  border-color: rgba(34, 197, 94, 0.5);
}

#btn-start-stop:hover {
  border-color: var(--accent-green);
  box-shadow: 0 0 16px rgba(34, 197, 94, 0.35);
}

#btn-start-stop.running {
  background: linear-gradient(145deg, rgba(239, 68, 68, 0.28), rgba(120, 20, 20, 0.45));
  border-color: var(--accent-red);
  box-shadow: 0 0 18px rgba(239, 68, 68, 0.38);
}

#btn-start-stop.running .btn-icon {
  color: #fca5a5;
}

/* 2. HORN Button Styling */
#btn-horn {
  background: linear-gradient(145deg, rgba(250, 204, 21, 0.18), rgba(85, 65, 5, 0.35));
  border-color: rgba(250, 204, 21, 0.4);
}

#btn-horn.active {
  background: linear-gradient(145deg, rgba(250, 204, 21, 0.42), rgba(140, 105, 10, 0.65));
  border-color: var(--accent-gold);
  box-shadow: 0 0 22px rgba(250, 204, 21, 0.5);
  transform: scale(0.95);
}

/* 3. LIGHT Button Styling */
#btn-light {
  background: linear-gradient(145deg, rgba(56, 189, 248, 0.16), rgba(15, 60, 90, 0.32));
  border-color: rgba(56, 189, 248, 0.38);
}

#btn-light.active {
  background: linear-gradient(145deg, rgba(56, 189, 248, 0.38), rgba(20, 95, 140, 0.58));
  border-color: var(--accent-cyan);
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.45);
}

/* Throttle Slider Stack inside Dock */
.throttle-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding-left: 8px;
  border-left: 1px solid var(--border-glass);
}

.throttle-label {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

#throttle-slider {
  width: 84px;
  accent-color: var(--accent-gold);
  cursor: pointer;
}

.dock-hint {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
  letter-spacing: 0.3px;
  pointer-events: none;
  opacity: 0.72;
}

/* =========================================================
   LOADING OVERLAY
   ========================================================= */
#loading-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #112238 0%, #070e18 100%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  transition: opacity 0.4s ease;
}

#loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.train-spinner {
  font-size: 46px;
  animation: trainBounce 1.1s infinite ease-in-out;
}

@keyframes trainBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.loader-title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.6px;
}

.loader-sub {
  font-size: 13px;
  color: var(--text-muted);
}

/* =========================================================
   MOBILE RESPONSIVENESS
   ========================================================= */
@media (max-width: 680px) {
  #train-controls-dock {
    bottom: 14px;
    gap: 8px;
    padding: 8px 12px;
  }

  .ctrl-btn {
    width: 72px;
    height: 68px;
    border-radius: 14px;
  }

  .ctrl-btn .btn-icon {
    font-size: 20px;
  }

  .ctrl-btn .btn-label {
    font-size: 11px;
  }

  .throttle-stack {
    display: none;
  }

  #left-camera-hud {
    left: 10px;
    gap: 8px;
    padding: 6px;
  }

  .cam-btn {
    width: 36px;
    height: 36px;
    font-size: 16px;
  }

  #top-hud {
    top: 8px;
    padding: 6px 10px;
    gap: 6px;
  }

  .hud-btn {
    padding: 5px 9px;
    font-size: 11.5px;
  }

  #perf-pill {
    display: none;
  }
}

/* Deck POV: cheap CSS-only windscreen vignette (no extra GPU geometry) */
body.deck-view #canvas-container::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 55%, transparent 58%, rgba(0, 0, 0, 0.38) 100%),
              linear-gradient(to bottom, rgba(0, 0, 0, 0.18), transparent 14%);
}

    </style>
</head>

    <!-- Loading Screen -->
    <div id="loading-overlay">
        <div class="train-spinner">🚂</div>

    </div>

    <!-- 3D Canvas Host -->
    <div id="canvas-container"></div>

    <!-- Top Status & Mode HUD -->
    <header id="top-hud">
        <button id="btn-day-night" class="hud-btn" title="Cycle Day / Golden Sunset / Moonlit Night (Hotkey: N)">
            <span class="hud-icon">☀️</span>
            <span class="hud-val">Day</span>
        </button>
        <button id="btn-rain" class="hud-btn" title="Toggle Rain Atmosphere (Hotkey: R)">
            <span class="hud-icon">🌧️</span>
            <span class="hud-val">Rain: OFF</span>
        </button>
        <button id="btn-cam-mode" class="hud-btn" title="Switch Camera View (Hotkey: C)">
            <span class="hud-val">🎥 Chase</span>

        <button id="btn-eco-mode" class="hud-btn eco-active" title="Toggle Thermal CPU / FPS Cap">
            <span class="hud-val">🌿 Cool 45 FPS</span>

        <button id="btn-mute" class="hud-btn" title="Mute / Unmute Sound">
            <span class="hud-icon">🔊</span>
        </button>
        <div class="hud-divider"></div>
        <div id="speed-gauge" title="Train Velocity">
            <span id="speed-gauge-val">0</span>
            <span id="speed-gauge-unit">km/h</span>
        </div>
    </header>

    <!-- Live Thermal & Draw-Call Telemetry Pill -->
    <div id="perf-pill" aria-live="polite">
        <span class="perf-dot"></span>
        <span id="perf-text">45 FPS · 24 Draw Calls · CPU Cool</span>
    </div>

    <!-- Left-Side Camera Navigation (+, -, Recenter) -->
    <nav id="left-camera-hud" aria-label="Camera Controls">
        <button id="btn-zoom-in" class="cam-btn" title="Zoom In (+)">+</button>
        <button id="btn-zoom-out" class="cam-btn" title="Zoom Out (-)">−</button>
        <button id="btn-recenter" class="cam-btn" title="Recenter Camera on Train">🎯</button>
    </nav>

    <!-- The 3 Primary Controllers Dock + Throttle Slider (Long-Tap Draggable) -->
    <div id="train-controls-dock" role="region" aria-label="Locomotive Controllers">
        <div class="drag-grip-indicator" title="Hold 500ms to drag dock">
            <span class="grip-bar"></span>
            <span class="grip-bar"></span>
            <span class="grip-bar"></span>
        </div>

        <!-- 1. Start / Stop Controller -->
        <button id="btn-start-stop" class="ctrl-btn" title="Toggle Throttle / Brakes (Hotkey: Space)">
            <span class="btn-icon">▶</span>
            <span class="btn-label">START</span>
            <span class="btn-sub">Throttle / Go</span>
        </button>

        <!-- 2. Horn Controller -->
        <button id="btn-horn" class="ctrl-btn" title="Sound Air Horn (Hotkey: H)">
            <span class="btn-icon">📢</span>
            <span class="btn-label">HORN</span>
            <span class="btn-sub">Press &amp; Hold</span>
        </button>

        <!-- 3. Light Controller -->
        <button id="btn-light" class="ctrl-btn" title="Toggle Headlight &amp; Coach Lights (Hotkey: L)">
            <span class="btn-icon">💡</span>
            <span class="btn-label">LIGHT</span>
            <span class="btn-sub">Lights OFF</span>
        </button>

        <!-- 4. Cruise Throttle Slider -->
        <div class="throttle-stack">
            <label for="throttle-slider" class="throttle-label">Throttle</label>
            <input id="throttle-slider" type="range" min="25" max="100" value="85" title="Adjust Cruising Speed">
        </div>

        <div class="dock-hint">Hold 500ms to drag dock anywhere · Space: Go/Stop · H: Horn · L: Lights · C: Camera</div>
    </div>

    <!-- Local Three.js with CDN fallback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Game Scripts -->

    <script>
// audio.js - Zero-Allocation Procedural Web Audio Synthesizer
// Features: Diesel Engine Pulse, Track Click-Clack Rhythm, Air Brake Hiss, Multi-Chime Nathan Horn & Rain Patter
class TrainAudioEngine {
    constructor() {
        this.audioCtx = null;
        this.isInitialized = false;
        this.isMuted = false;

        this.masterGain = null;
        this.engineOsc1 = null;
        this.engineOsc2 = null;
        this.engineFilter = null;
        this.engineGain = null;
        this.lfo = null;
        this.lfoGain = null;

        this.wheelSource = null;
        this.wheelGain = null;
        this.rainGain = null;
        this.noiseBuffer = null;

        this.hornGain = null;
        this.hornOscs = [];

        this.isEngineRunning = false;
        this.isRaining = false;

        // Auto-suspend audio when browser tab is hidden to save CPU
        document.addEventListener('visibilitychange', () => {
            if (!this.audioCtx) return;
            if (document.hidden) {
                this.audioCtx.suspend();
            } else if (!this.isMuted) {
                this.audioCtx.resume();
            }
        });
    }

    init() {
        if (this.isInitialized) {
            if (this.audioCtx && this.audioCtx.state === 'suspended' && !this.isMuted) {
                this.audioCtx.resume();
            }
            return;
        }

        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.audioCtx = new AC();

        const comp = this.audioCtx.createDynamicsCompressor();
        comp.connect(this.audioCtx.destination);

        this.masterGain = this.audioCtx.createGain();
        this.masterGain.gain.setValueAtTime(0.8, this.audioCtx.currentTime);
        this.masterGain.connect(comp);

        this._buildSharedBuffers();
        this._setupDieselEngine();
        this._setupTrackRhythm();
        this._setupRainAmbience();

        this.isInitialized = true;
    }

    _buildSharedBuffers() {
        const sr = this.audioCtx.sampleRate;
        this.noiseBuffer = this.audioCtx.createBuffer(1, sr * 2, sr);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
            data[i] = Math.random() * 2 - 1;
        }
    }

    _setupDieselEngine() {
        const t = this.audioCtx.currentTime;
        this.engineOsc1 = this.audioCtx.createOscillator();
        this.engineOsc1.type = 'sawtooth';
        this.engineOsc1.frequency.setValueAtTime(GAME_CONFIG.audio.idleRpmFreq, t);

        this.engineOsc2 = this.audioCtx.createOscillator();
        this.engineOsc2.type = 'triangle';
        this.engineOsc2.frequency.setValueAtTime(GAME_CONFIG.audio.idleRpmFreq * 1.5, t);

        this.engineFilter = this.audioCtx.createBiquadFilter();
        this.engineFilter.type = 'lowpass';
        this.engineFilter.frequency.setValueAtTime(180, t);
        this.engineFilter.Q.setValueAtTime(2.2, t);

        this.engineGain = this.audioCtx.createGain();
        this.engineGain.gain.setValueAtTime(0.0, t);

        this.lfo = this.audioCtx.createOscillator();
        this.lfo.type = 'sine';
        this.lfo.frequency.setValueAtTime(7, t);
        this.lfoGain = this.audioCtx.createGain();
        this.lfoGain.gain.setValueAtTime(0.04, t);
        this.lfo.connect(this.lfoGain);
        this.lfoGain.connect(this.engineGain.gain);

        this.engineOsc1.connect(this.engineFilter);
        this.engineOsc2.connect(this.engineFilter);
        this.engineFilter.connect(this.engineGain);
        this.engineGain.connect(this.masterGain);

        this.engineOsc1.start();
        this.engineOsc2.start();
        this.lfo.start();
    }

    _setupTrackRhythm() {
        const sr = this.audioCtx.sampleRate;
        const len = Math.floor(sr * 1.2);
        const buf = this.audioCtx.createBuffer(1, len, sr);
        const d = buf.getChannelData(0);
        const hits = [0.0, 0.14, 0.60, 0.74];

        hits.forEach((hitTime, idx) => {
            const st = Math.floor(hitTime * sr);
            const dur = Math.floor(sr * 0.08);
            let lpv = 0;
            for (let k = 0; k < dur && st + k < len; k++) {
                const env = Math.exp(-k / (sr * 0.016));
                const n = Math.random() * 2 - 1;
                lpv += (n - lpv) * 0.25;
                d[st + k] += (lpv * 0.7 + Math.sin(2 * Math.PI * 90 * k / sr) * 0.4) * env * (idx % 2 ? 0.75 : 1.0);
            }
        });

        this.wheelSource = this.audioCtx.createBufferSource();
        this.wheelSource.buffer = buf;
        this.wheelSource.loop = true;

        const hp = this.audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.setValueAtTime(75, this.audioCtx.currentTime);

        this.wheelGain = this.audioCtx.createGain();
        this.wheelGain.gain.setValueAtTime(0.0, this.audioCtx.currentTime);

        this.wheelSource.connect(hp);
        hp.connect(this.wheelGain);
        this.wheelGain.connect(this.masterGain);
        this.wheelSource.start();
    }

    _setupRainAmbience() {
        const src = this.audioCtx.createBufferSource();
        src.buffer = this.noiseBuffer;
        src.loop = true;

        const filter = this.audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1100, this.audioCtx.currentTime);

        this.rainGain = this.audioCtx.createGain();
        this.rainGain.gain.setValueAtTime(0.0, this.audioCtx.currentTime);

        src.connect(filter);
        filter.connect(this.rainGain);
        this.rainGain.connect(this.masterGain);
        src.start();
    }

    toggleMute() {
        this.init();
        this.isMuted = !this.isMuted;
        if (this.masterGain && this.audioCtx) {
            this.masterGain.gain.setTargetAtTime(this.isMuted ? 0.0 : 0.8, this.audioCtx.currentTime, 0.08);
        }
        return this.isMuted;
    }

    startEngine() {
        this.init();
        if (!this.audioCtx) return;
        this.isEngineRunning = true;
        this.engineGain.gain.setTargetAtTime(0.22, this.audioCtx.currentTime, 0.25);
    }

    stopEngine() {
        if (!this.isInitialized || !this.audioCtx) return;
        this.isEngineRunning = false;
        this.playAirHiss();
        this.engineGain.gain.setTargetAtTime(0.0, this.audioCtx.currentTime, 0.5);
        this.wheelGain.gain.setTargetAtTime(0.0, this.audioCtx.currentTime, 0.3);
    }

    updateRPM(speedRatio, isRunning) {
        if (!this.isInitialized || !this.audioCtx) return;
        const t = this.audioCtx.currentTime;
        const active = isRunning || speedRatio > 0.01;

        const baseFreq = GAME_CONFIG.audio.idleRpmFreq + (GAME_CONFIG.audio.maxRpmFreq - GAME_CONFIG.audio.idleRpmFreq) * speedRatio;
        this.engineOsc1.frequency.setTargetAtTime(baseFreq, t, 0.15);
        this.engineOsc2.frequency.setTargetAtTime(baseFreq * 1.5, t, 0.15);
        this.engineFilter.frequency.setTargetAtTime(170 + speedRatio * 360, t, 0.15);
        this.lfo.frequency.setTargetAtTime(6 + speedRatio * 14, t, 0.15);
        this.engineGain.gain.setTargetAtTime(active ? (0.14 + speedRatio * 0.18) : 0.0, t, 0.2);

        this.wheelSource.playbackRate.setTargetAtTime(Math.max(0.1, 0.45 + speedRatio * 1.15), t, 0.1);
        this.wheelGain.gain.setTargetAtTime(speedRatio > 0.02 ? Math.min(0.55, speedRatio * 0.65) : 0.0, t, 0.12);
    }

    startHorn() {
        this.init();
        if (!this.audioCtx || this.hornGain) return;
        const now = this.audioCtx.currentTime;

        this.hornGain = this.audioCtx.createGain();
        this.hornGain.gain.setValueAtTime(0.0, now);
        this.hornGain.gain.linearRampToValueAtTime(0.26, now + 0.05);

        const lp = this.audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(1650, now);
        lp.connect(this.hornGain);
        this.hornGain.connect(this.masterGain);

        const freqs = GAME_CONFIG.audio.hornFrequencies || [311.13, 370.00, 466.16];
        this.hornOscs = freqs.map(f => {
            const osc = this.audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, now);
            osc.connect(lp);
            osc.start(now);
            return osc;
        });
    }

    stopHorn() {
        if (!this.audioCtx || !this.hornGain) return;
        const now = this.audioCtx.currentTime;
        const g = this.hornGain;
        const oscs = this.hornOscs;
        this.hornGain = null;
        this.hornOscs = [];

        g.gain.cancelScheduledValues(now);
        g.gain.setValueAtTime(g.gain.value, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        setTimeout(() => {
            oscs.forEach(o => { try { o.stop(); } catch (e) {} });
        }, 250);
    }

    playHorn() {
        this.startHorn();
        setTimeout(() => this.stopHorn(), 850);
    }

    playAirHiss() {
        if (!this.isInitialized || !this.audioCtx) return;
        const t = this.audioCtx.currentTime;
        const s = this.audioCtx.createBufferSource();
        s.buffer = this.noiseBuffer;

        const f = this.audioCtx.createBiquadFilter();
        f.type = 'highpass';
        f.frequency.setValueAtTime(2800, t);

        const g = this.audioCtx.createGain();
        g.gain.setValueAtTime(0.0, t);
        g.gain.linearRampToValueAtTime(0.18, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);

        s.connect(f);
        f.connect(g);
        g.connect(this.masterGain);
        s.start(t);
        s.stop(t + 1.15);
    }

    setRainSound(enable) {
        this.init();
        if (!this.audioCtx || !this.rainGain) return;
        this.isRaining = enable;
        const target = enable ? (GAME_CONFIG.audio.rainNoiseDensity || 0.22) : 0.0;
        this.rainGain.gain.setTargetAtTime(target, this.audioCtx.currentTime, 0.35);
    }
}

    <script>
// track.js - Continuous Figure-8 Infinity Railway Circuit with O(1) Pre-Baked Float32Array Lookup
// Features: Single-pass continuous ballast embankment ribbon, dual Vignoles steel rails, instanced sleepers, and Steel Truss Overpass Bridge
class TrackSystem {
    constructor(scene) {
        this.scene = scene;
        this.spline = null;
        this.totalLength = 0;
        this.trackGroup = new THREE.Group();
        this.scene.add(this.trackGroup);

        // Pre-baked O(1) Lookup Buffers (Zero per-frame Catmull-Rom polynomial math!)
        this.N = GAME_CONFIG.track.lookupSamples || 4096;
        this.X = new Float32Array(this.N + 1);
        this.Y = new Float32Array(this.N + 1);
        this.Z = new Float32Array(this.N + 1);
        this.TX = new Float32Array(this.N + 1);
        this.TY = new Float32Array(this.N + 1);
        this.TZ = new Float32Array(this.N + 1);

        this.initSplineAndBakeTable();
        this.buildBallastAndEmbankment();
        this.buildRails();
        this.buildSleepers();
        this.buildBridgeOverpass();
    }

    initSplineAndBakeTable() {
        const L = 950.0;
        const W = 320.0;

        const points = [
            // 1. Lower Track crossing center at Y = 0.0m (Ground level, heading South-East)
            new THREE.Vector3( -120.0, 0.0, -200.0 ),
            new THREE.Vector3(    0.0, 0.0,    0.0 ),
            new THREE.Vector3(  120.0, 0.0,  200.0 ),

            // 2. South Village Loop
            new THREE.Vector3( W * 0.7, 0.0,   500.0 ),
            new THREE.Vector3( W      , 0.0,   800.0 ),
            new THREE.Vector3( W * 0.8, 0.0, L + 120.0 ),
            new THREE.Vector3( W * 0.4, 0.0, L + 280.0 ),
            new THREE.Vector3(     0.0, 0.0, L + 340.0 ),
            new THREE.Vector3(-W * 0.4, 0.0, L + 280.0 ),
            new THREE.Vector3(-W * 0.8, 0.0, L + 120.0 ),
            new THREE.Vector3(-W      , 0.0,   800.0 ),

            // 3. Gentle incline climbing towards central railway bridge overpass
            new THREE.Vector3(-W * 0.65, 1.3, 500.0 ),
            new THREE.Vector3(  -120.0,  3.4, 200.0 ),

            // 4. Upper Bridge Overpass at Y = 5.0m (Crossing directly over lower track at 0.0m)
            new THREE.Vector3(     0.0,  5.0,   0.0 ),

            // 5. Gentle decline into North Village Loop
            new THREE.Vector3(   120.0,  3.4, -200.0 ),
            new THREE.Vector3( W * 0.65, 1.3, -500.0 ),

            // 6. North Village Loop
            new THREE.Vector3( W      , 0.0, -800.0 ),
            new THREE.Vector3( W * 0.8, 0.0, -L - 120.0 ),
            new THREE.Vector3( W * 0.4, 0.0, -L - 280.0 ),
            new THREE.Vector3(     0.0, 0.0, -L - 340.0 ),
            new THREE.Vector3(-W * 0.4, 0.0, -L - 280.0 ),
            new THREE.Vector3(-W * 0.8, 0.0, -L - 120.0 ),
            new THREE.Vector3(-W      , 0.0, -800.0 ),
            new THREE.Vector3(-W * 0.7, 0.0, -500.0 )
        ];

        this.spline = new THREE.CatmullRomCurve3(points, true, 'centripetal', 0.15);
        this.spline.arcLengthDivisions = 4000;
        this.totalLength = this.spline.getLength();

        // Pre-bake N uniform samples once at initialization
        const pt = new THREE.Vector3();
        const tan = new THREE.Vector3();
        for (let i = 0; i <= this.N; i++) {
            const u = i / this.N;
            this.spline.getPointAt(u, pt);
            this.spline.getTangentAt(u, tan);
            this.X[i] = pt.x;
            this.Y[i] = pt.y;
            this.Z[i] = pt.z;
            this.TX[i] = tan.x;
            this.TY[i] = tan.y;
            this.TZ[i] = tan.z;
        }
    }

    // O(1) Zero-Allocation Position Lookup
    samplePoint(u, outVec) {
        let normU = u % 1.0;
        if (normU < 0) normU += 1.0;
        const f = normU * this.N;
        const i = Math.min(this.N - 1, f | 0);
        const t = f - i;
        outVec.x = this.X[i] + (this.X[i + 1] - this.X[i]) * t;
        outVec.y = this.Y[i] + (this.Y[i + 1] - this.Y[i]) * t;
        outVec.z = this.Z[i] + (this.Z[i + 1] - this.Z[i]) * t;
        return outVec;
    }

    // O(1) Zero-Allocation Tangent Lookup
    sampleTangent(u, outVec) {
        let normU = u % 1.0;
        if (normU < 0) normU += 1.0;
        const f = normU * this.N;
        const i = Math.min(this.N - 1, f | 0);
        const t = f - i;
        const tx = this.TX[i] + (this.TX[i + 1] - this.TX[i]) * t;
        const ty = this.TY[i] + (this.TY[i + 1] - this.TY[i]) * t;
        const tz = this.TZ[i] + (this.TZ[i + 1] - this.TZ[i]) * t;
        const len = Math.hypot(tx, ty, tz) || 1.0;
        outVec.x = tx / len;
        outVec.y = ty / len;
        outVec.z = tz / len;
        return outVec;
    }

    // Fast Track Safety Clearance Check (ensures trees, cottages & farms never encroach on tracks)
    getMinDistanceToTrack(x, z, step = 16) {
        let minSq = Infinity;
        for (let i = 0; i <= this.N; i += step) {
            const dx = x - this.X[i];
            const dz = z - this.Z[i];
            const sq = dx * dx + dz * dz;
            if (sq < minSq) minSq = sq;
        }
        return Math.sqrt(minSq);
    }

    // Builds a single-draw-call procedural crushed stone ballast & embankment ribbon
    buildBallastAndEmbankment() {
        const samples = 640;
        const topHalf = (GAME_CONFIG.track.ballastTopWidth || 3.4) * 0.5;
        const baseHalf = (GAME_CONFIG.track.ballastBaseWidth || 5.4) * 0.5;

        // Procedural gravel texture
        const c = document.createElement('canvas');
        c.width = 128; c.height = 128;
        const g = c.getContext('2d');
        g.fillStyle = '#4c4741';
        g.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 650; i++) {
            const shade = 52 + ((i * 37) % 42);
            g.fillStyle = `rgb(${shade},${shade - 3},${shade - 7})`;
            g.fillRect((i * 73) % 126, (i * 41) % 126, 3, 3);
        }
        const gravelTex = new THREE.CanvasTexture(c);
        gravelTex.wrapS = THREE.RepeatWrapping;
        gravelTex.wrapT = THREE.RepeatWrapping;
        gravelTex.repeat.set(1, 220);

        // 4 vertices per cross-section: left-base, left-top, right-top, right-base
        const vCount = (samples + 1) * 4;
        const pos = new Float32Array(vCount * 3);
        const uvs = new Float32Array(vCount * 2);
        const indices = new Uint32Array(samples * 18);

        const pt = new THREE.Vector3();
        const tan = new THREE.Vector3();

        for (let i = 0; i <= samples; i++) {
            const u = i / samples;
            this.samplePoint(u, pt);
            this.sampleTangent(u, tan);

            const nx = -tan.z;
            const nz = tan.x;
            const nLen = Math.hypot(nx, nz) || 1;
            const rx = nx / nLen;
            const rz = nz / nLen;

            // On bridge section (pt.y > 0.6), narrow the embankment to fit inside the steel bridge deck
            const bridgeFactor = Math.min(1.0, Math.max(0.0, (pt.y - 0.5) / 1.5));
            const curBaseHalf = baseHalf * (1.0 - bridgeFactor * 0.42);
            const curBaseY = pt.y > 0.6 ? pt.y - 0.12 : -0.25;
            const curTopY = pt.y + 0.04;

            const baseIdx = i * 12;
            // 0: Left base
            pos[baseIdx]     = pt.x - rx * curBaseHalf;
            pos[baseIdx + 1] = curBaseY;
            pos[baseIdx + 2] = pt.z - rz * curBaseHalf;
            // 1: Left top
            pos[baseIdx + 3] = pt.x - rx * topHalf;
            pos[baseIdx + 4] = curTopY;
            pos[baseIdx + 5] = pt.z - rz * topHalf;
            // 2: Right top
            pos[baseIdx + 6] = pt.x + rx * topHalf;
            pos[baseIdx + 7] = curTopY;
            pos[baseIdx + 8] = pt.z + rz * topHalf;
            // 3: Right base
            pos[baseIdx + 9]  = pt.x + rx * curBaseHalf;
            pos[baseIdx + 10] = curBaseY;
            pos[baseIdx + 11] = pt.z + rz * curBaseHalf;

            const uvIdx = i * 8;
            uvs[uvIdx] = 0.0; uvs[uvIdx + 1] = u;
            uvs[uvIdx + 2] = 0.25; uvs[uvIdx + 3] = u;
            uvs[uvIdx + 4] = 0.75; uvs[uvIdx + 5] = u;
            uvs[uvIdx + 6] = 1.0; uvs[uvIdx + 7] = u;

            if (i < samples) {
                const r0 = i * 4;
                const r1 = (i + 1) * 4;
                const k = i * 18;
                // Left slope
                indices[k]     = r0;     indices[k + 1] = r1;     indices[k + 2] = r0 + 1;
                indices[k + 3] = r0 + 1; indices[k + 4] = r1;     indices[k + 5] = r1 + 1;
                // Top bed
                indices[k + 6] = r0 + 1; indices[k + 7] = r1 + 1; indices[k + 8] = r0 + 2;
                indices[k + 9] = r0 + 2; indices[k + 10] = r1 + 1; indices[k + 11] = r1 + 2;
                // Right slope
                indices[k + 12] = r0 + 2; indices[k + 13] = r1 + 2; indices[k + 14] = r0 + 3;
                indices[k + 15] = r0 + 3; indices[k + 16] = r1 + 2; indices[k + 17] = r1 + 3;
            }
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        geom.setIndex(new THREE.BufferAttribute(indices, 1));
        geom.computeVertexNormals();

        const ballastMesh = new THREE.Mesh(
            geom,
            new THREE.MeshLambertMaterial({ map: gravelTex })
        );
        this.trackGroup.add(ballastMesh);
    }

    buildRails() {
        const halfGauge = GAME_CONFIG.track.gauge * 0.5;
        const samples = 480;

        const railMat = new THREE.MeshLambertMaterial({
            color: GAME_CONFIG.colors.rails,
            emissive: 0x1a2026
        });

        const pt = new THREE.Vector3();
        const tan = new THREE.Vector3();

        [-1, 1].forEach(offsetSign => {
            const offsetDist = halfGauge * offsetSign;
            const railCurvePoints = [];

            for (let i = 0; i <= samples; i++) {
                const u = i / samples;
                this.samplePoint(u, pt);
                this.sampleTangent(u, tan);
                const nx = -tan.z;
                const nz = tan.x;
                const nLen = Math.hypot(nx, nz) || 1;
                railCurvePoints.push(new THREE.Vector3(
                    pt.x + (nx / nLen) * offsetDist,
                    pt.y + GAME_CONFIG.track.sleeperHeight + 0.03,
                    pt.z + (nz / nLen) * offsetDist
                ));
            }

            const railCurve = new THREE.CatmullRomCurve3(railCurvePoints, true);
            const railGeom = new THREE.TubeGeometry(railCurve, samples, 0.048, 5, true);
            const railMesh = new THREE.Mesh(railGeom, railMat);
            this.trackGroup.add(railMesh);
        });
    }

    buildSleepers() {
        const sleeperSpacing = GAME_CONFIG.track.sleeperSpacing || 1.4;
        const count = Math.floor(this.totalLength / sleeperSpacing);

        const sleeperGeom = new THREE.BoxGeometry(
            GAME_CONFIG.track.sleeperWidth,
            GAME_CONFIG.track.sleeperHeight,
            GAME_CONFIG.track.sleeperDepth
        );

        const sleeperMat = new THREE.MeshLambertMaterial({
            color: GAME_CONFIG.colors.sleepers
        });

        const instancedSleepers = new THREE.InstancedMesh(sleeperGeom, sleeperMat, count);
        const dummy = new THREE.Object3D();
        const pos = new THREE.Vector3();
        const tangent = new THREE.Vector3();

        for (let i = 0; i < count; i++) {
            const u = i / count;
            this.samplePoint(u, pos);
            this.sampleTangent(u, tangent);

            dummy.position.set(pos.x, pos.y + GAME_CONFIG.track.sleeperHeight * 0.5, pos.z);
            const pitch = -Math.atan2(tangent.y, Math.hypot(tangent.x, tangent.z));
            dummy.rotation.set(pitch, Math.atan2(tangent.x, tangent.z), 0, 'YXZ');
            dummy.updateMatrix();
            instancedSleepers.setMatrixAt(i, dummy.matrix);
        }

        instancedSleepers.instanceMatrix.needsUpdate = true;
        this.trackGroup.add(instancedSleepers);
    }

    // Grand Steel Truss & Concrete Pier Overpass Bridge at the Center Crossing
    buildBridgeOverpass() {
        const bridgeGroup = new THREE.Group();
        const concreteMat = new THREE.MeshLambertMaterial({ color: 0x8e887f });
        const steelMat = new THREE.MeshLambertMaterial({ color: 0x2c4252 });
        const accentMat = new THREE.MeshLambertMaterial({ color: 0xc4a76c });

        const bridgeAngle = -Math.atan2(120, 200);
        bridgeGroup.rotation.y = bridgeAngle;

        // 1. Concrete support piers (placed clear of the lower track)
        [-14, 14, -32, 32].forEach(zOff => {
            [-2.1, 2.1].forEach(xOff => {
                const h = Math.abs(zOff) < 20 ? 4.8 : 4.2;
                const pier = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.72, h, 8), concreteMat);
                pier.position.set(xOff, h * 0.5 - 0.1, zOff);
                bridgeGroup.add(pier);
            });
            const cap = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.45, 1.4), concreteMat);
            cap.position.set(0, Math.abs(zOff) < 20 ? 4.55 : 3.95, zOff);
            bridgeGroup.add(cap);
        });

        // 2. Main bridge deck & side girders

// physics.js - Zero-Allocation Multi-Car Train Kinematics using Pre-Baked O(1) Track Lookup
class TrainPhysics {
    constructor(trackSystem) {
        this.trackSystem = trackSystem;
        this.trackSpline = trackSystem.spline;
        this.trackLength = trackSystem.totalLength;

        // Kinematic states
        this.speed = 0.0;                  // Current speed in m/s
        this.targetSpeed = 0.0;            // Target speed in m/s
        this.throttleFraction = 0.85;      // User throttle setting (0.2 to 1.0)
        this.isRunning = false;            // Throttle active state
        this.progress = 0.02;              // Normalized track parameter u in [0, 1)
        this.wheelRotation = 0.0;          // Wheel rotation in radians

        // Locomotive Kinematics (Car 0)
        this.currentPosition = new THREE.Vector3();
        this.currentTangent = new THREE.Vector3();
        this.frontBogiePos = new THREE.Vector3();
        this.rearBogiePos = new THREE.Vector3();
        this.frontBogieTan = new THREE.Vector3();
        this.rearBogieTan = new THREE.Vector3();

        // 5 Trailing Carriages Kinematics (Cars 1 to 5)
        this.carriageCount = GAME_CONFIG.train.carriageCount || 5;
        this.carriageSpacing = GAME_CONFIG.train.carriageSpacing || 12.3;
        this.carriagesData = [];

        for (let i = 0; i < this.carriageCount; i++) {
            this.carriagesData.push({
                position: new THREE.Vector3(),
                tangent: new THREE.Vector3(),
                frontBogiePos: new THREE.Vector3(),
                rearBogiePos: new THREE.Vector3(),
                frontTangent: new THREE.Vector3(),
                rearTangent: new THREE.Vector3(),
                wheelRotation: 0.0,
                progress: 0.02
            });
        }

        // Compute initial positions once at boot
        this._syncAllCarPositions();
    }

    setRunning(isRunning) {
        this.isRunning = isRunning;
        this.targetSpeed = isRunning ? (GAME_CONFIG.train.maxSpeed * this.throttleFraction) : 0.0;
    }

    setThrottleFraction(fraction) {
        this.throttleFraction = Math.max(0.2, Math.min(1.0, fraction));
        if (this.isRunning) {
            this.targetSpeed = GAME_CONFIG.train.maxSpeed * this.throttleFraction;
        }
    }

    setTargetSpeed(targetSpeed) {
        this.targetSpeed = Math.max(0.0, Math.min(GAME_CONFIG.train.maxSpeed, targetSpeed));
    }

    update(dt) {
        const delta = Math.min(dt, 0.1);

        // Smooth acceleration / braking dynamics
        if (this.speed < this.targetSpeed) {
            this.speed += GAME_CONFIG.train.acceleration * delta;
            if (this.speed > this.targetSpeed) this.speed = this.targetSpeed;
        } else if (this.speed > this.targetSpeed) {
            const decelRate = this.targetSpeed === 0.0
                ? GAME_CONFIG.train.deceleration
                : GAME_CONFIG.train.friction * 2.5;
            this.speed -= decelRate * delta;
            if (this.speed < this.targetSpeed) this.speed = this.targetSpeed;
        }

        // Skip spline updates completely if stationary (saves CPU!)
        if (this.speed <= 0.0001) {
            this.speed = 0.0;
            return false; // Indicates no movement occurred
        }

        const distanceDelta = this.speed * delta;
        this.wheelRotation += distanceDelta / GAME_CONFIG.train.wheelRadius;

        const deltaU = distanceDelta / this.trackLength;
        this.progress = (this.progress + deltaU) % 1.0;

        this._syncAllCarPositions();
        return true;
    }

    _syncAllCarPositions() {
        // 1. Locomotive
        this._updateCarKinematics(
            this.progress,
            GAME_CONFIG.train.bogieDistance,
            this.currentPosition,
            this.currentTangent,
            this.frontBogiePos,
            this.rearBogiePos,
            this.frontBogieTan,
            this.rearBogieTan
        );

        // 2. Trailing Passenger Carriages
        const bogieDist = GAME_CONFIG.train.carriageBogieDist || GAME_CONFIG.train.bogieDistance;
        for (let i = 0; i < this.carriageCount; i++) {
            const carOffsetMeters = (i + 1) * this.carriageSpacing;
            let carProgress = (this.progress - (carOffsetMeters / this.trackLength)) % 1.0;
            if (carProgress < 0) carProgress += 1.0;

            const car = this.carriagesData[i];
            car.progress = carProgress;
            car.wheelRotation = this.wheelRotation;

            this._updateCarKinematics(
                carProgress,
                bogieDist,
                car.position,
                car.tangent,
                car.frontBogiePos,
                car.rearBogiePos,
                car.frontTangent,
                car.rearTangent
            );
        }
    }

    _updateCarKinematics(uCenter, bogieDist, outCenterPos, outTangent, outFrontBogie, outRearBogie, outFrontTan, outRearTan) {
        const halfBogieU = (bogieDist * 0.5) / this.trackLength;

        let uFront = (uCenter + halfBogieU) % 1.0;
        let uRear = (uCenter - halfBogieU) % 1.0;
        if (uFront < 0) uFront += 1.0;
        if (uRear < 0) uRear += 1.0;

        this.trackSystem.samplePoint(uFront, outFrontBogie);
        this.trackSystem.samplePoint(uRear, outRearBogie);
        this.trackSystem.sampleTangent(uFront, outFrontTan);
        this.trackSystem.sampleTangent(uRear, outRearTan);

        outCenterPos.x = (outFrontBogie.x + outRearBogie.x) * 0.5;
        outCenterPos.y = (outFrontBogie.y + outRearBogie.y) * 0.5;
        outCenterPos.z = (outFrontBogie.z + outRearBogie.z) * 0.5;

        const dx = outFrontBogie.x - outRearBogie.x;
        const dy = outFrontBogie.y - outRearBogie.y;
        const dz = outFrontBogie.z - outRearBogie.z;
        const len = Math.hypot(dx, dy, dz) || 1.0;
        outTangent.x = dx / len;
        outTangent.y = dy / len;
        outTangent.z = dz / len;
    }

    getKmh() {
        return Math.round(this.speed * 3.6);
    }

    getSpeedRatio() {
        return Math.min(1.0, this.speed / GAME_CONFIG.train.maxSpeed);
    }
}

            bellows.position.set(0, 2.35, L * 0.5 + 0.32);
            carGroup.add(bellows);

            // Articulated Bogies
            const frontBogie = this.createBogie();
            const rearBogie = this.createBogie();
            this.root.add(frontBogie, rearBogie);

            this.carriages.push({
                group: carGroup,
                frontBogie: frontBogie,
                rearBogie: rearBogie
            });
        }
    }

    createBogie() {
        const bogieGroup = new THREE.Group();
        const frameMat = new THREE.MeshLambertMaterial({ color: GAME_CONFIG.colors.trainBogies });
        const wheelMat = new THREE.MeshLambertMaterial({ color: GAME_CONFIG.colors.trainWheels });

        const frame = new THREE.Mesh(new THREE.BoxGeometry(2.28, 0.26, 2.4), frameMat);
        frame.position.y = 0.64;
        bogieGroup.add(frame);

        const wheelR = GAME_CONFIG.train.wheelRadius || 0.52;
        const halfGauge = 0.82;
        const wheelGeo = new THREE.CylinderGeometry(wheelR, wheelR, 0.12, 10);
        wheelGeo.rotateZ(Math.PI * 0.5);

        [-0.82, 0.82].forEach(z => {
            const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, halfGauge * 2, 6), frameMat);
            axle.rotateZ(Math.PI * 0.5);
            axle.position.set(0, 0.54, z);
            bogieGroup.add(axle);

            [-halfGauge, halfGauge].forEach(x => {
                const wheelPivot = new THREE.Group();
                wheelPivot.position.set(x, 0.54, z);
                wheelPivot.add(new THREE.Mesh(wheelGeo, wheelMat));
                bogieGroup.add(wheelPivot);
                this.wheelMeshes.push(wheelPivot);
            });
        });

        return bogieGroup;
    }

    _initExhaustSmoke() {
        const puffGeo = new THREE.IcosahedronGeometry(0.32, 0);
        for (let i = 0; i < 14; i++) {
            const mat = new THREE.MeshBasicMaterial({
                color: 0xd8dee6,
                transparent: true,
                opacity: 0.0,
                depthWrite: false
            });
            const mesh = new THREE.Mesh(puffGeo, mat);
            mesh.visible = false;
            this.scene.add(mesh);
            this.smokePool.push({
                mesh: mesh,
                mat: mat,
                age: 99,
                maxAge: 1.4,
                vx: 0, vy: 0, vz: 0
            });
        }
    }

    toggleLights() {
        this.setLights(!this.lightsOn);
        return this.lightsOn;
    }

    setLights(on) {
        this.lightsOn = on;
        if (this.headlight) {
            this.headlight.intensity = on ? 3.2 : 0.0;
        }
        if (this.headlightBeamMesh) {
            this.headlightBeamMesh.visible = on;
        }
        if (this.headlightLensMat) {
            this.headlightLensMat.color.setHex(on ? 0xfff8d6 : 0x555555);
        }
        const glow = on ? 1.35 : 0.06;
        for (let i = 0; i < this.emissiveMaterials.length; i++) {
            this.emissiveMaterials[i].emissiveIntensity = glow;
        }
    }

    forceUpdate() {
        this._syncMeshes();
    }

    update(dt, moved) {
        // Rotate cooling fans smoothly even when idling if engine is running
        const fanSpeed = this.physics.isRunning ? (4.0 + this.physics.speed * 0.8) : 0.8;
        for (let i = 0; i < this.roofFans.length; i++) {
            this.roofFans[i].rotation.y += fanSpeed * dt;
        }

        // Update exhaust smoke puffs
        this._updateSmoke(dt);

        if (moved) {
            this._syncMeshes();
        }
    }

    _syncMeshes() {
        // 1. Lead Locomotive
        const pos = this.physics.currentPosition;
        const tangent = this.physics.currentTangent;

        this.bodyGroup.position.copy(pos);
        this.bodyGroup.rotation.y = Math.atan2(tangent.x, tangent.z);
        this.bodyGroup.rotation.x = -Math.atan2(tangent.y, Math.hypot(tangent.x, tangent.z));

        this.frontBogie.position.copy(this.physics.frontBogiePos);
        this.rearBogie.position.copy(this.physics.rearBogiePos);
        this.frontBogie.rotation.y = Math.atan2(this.physics.frontBogieTan.x, this.physics.frontBogieTan.z);
        this.rearBogie.rotation.y = Math.atan2(this.physics.rearBogieTan.x, this.physics.rearBogieTan.z);

        // 2. 5 Passenger Carriages
        const count = this.carriages.length;
        for (let i = 0; i < count; i++) {
            const car = this.carriages[i];
            const data = this.physics.carriagesData[i];

            car.group.position.copy(data.position);
            car.group.rotation.y = Math.atan2(data.tangent.x, data.tangent.z);
            car.group.rotation.x = -Math.atan2(data.tangent.y, Math.hypot(data.tangent.x, data.tangent.z));

            car.frontBogie.position.copy(data.frontBogiePos);
            car.rearBogie.position.copy(data.rearBogiePos);
            car.frontBogie.rotation.y = Math.atan2(data.frontTangent.x, data.frontTangent.z);
            car.rearBogie.rotation.y = Math.atan2(data.rearTangent.x, data.rearTangent.z);
        }

        // 3. Wheels
        const rot = this.physics.wheelRotation;
        for (let i = 0; i < this.wheelMeshes.length; i++) {
            this.wheelMeshes[i].rotation.x = rot;
        }
    }

    _updateSmoke(dt) {
        const isActive = this.physics.isRunning || this.physics.speed > 0.2;
        const interval = isActive ? Math.max(0.06, 0.22 - this.physics.getSpeedRatio() * 0.14) : 0.6;
        this.smokeTimer += dt;

        if (this.smokeTimer >= interval) {
            this.smokeTimer = 0;
            // Find an inactive puff
            for (let i = 0; i < this.smokePool.length; i++) {
                const p = this.smokePool[i];
                if (p.age >= p.maxAge) {
                    const pos = this.physics.currentPosition;
                    const tan = this.physics.currentTangent;
                    p.age = 0;
                    p.maxAge = 1.1 + Math.random() * 0.4;
                    p.mesh.position.set(
                        pos.x - tan.x * 1.8 + (Math.random() - 0.5) * 0.2,
                        pos.y + 4.1,
                        pos.z - tan.z * 1.8 + (Math.random() - 0.5) * 0.2
                    );
                    p.vx = (Math.random() - 0.5) * 0.8 - tan.x * (this.physics.speed * 0.18);
                    p.vy = 2.2 + this.physics.getSpeedRatio() * 2.4;
                    p.vz = (Math.random() - 0.5) * 0.8 - tan.z * (this.physics.speed * 0.18);
                    p.mesh.scale.setScalar(0.55);
                    p.mat.opacity = isActive ? 0.38 : 0.15;
                    p.mesh.visible = true;
                    break;
                }
            }
        }

        for (let i = 0; i < this.smokePool.length; i++) {
            const p = this.smokePool[i];
            if (p.age < p.maxAge) {
                p.age += dt;
                if (p.age >= p.maxAge) {
                    p.mesh.visible = false;
                } else {
                    const t = p.age / p.maxAge;
                    p.mesh.position.x += p.vx * dt;
                    p.mesh.position.y += p.vy * dt;
                    p.mesh.position.z += p.vz * dt;
                    p.mesh.scale.setScalar(0.55 + t * 2.1);
                    p.mat.opacity = (1.0 - t) * 0.34;
                }
            }
        }
    }
}

    <script>
// environment.js - 100% GPU-Instanced Scenic World (Station, Lake, Cottages, Forest, Cliffs, Level Crossing & Poles)
// Cuts scene draw calls from 1,600+ down to ~22 draw calls total!
class EnvironmentManager {
    constructor(scene, trackSystem) {
        this.scene = scene;
        this.trackSystem = trackSystem;
        this.trackLength = trackSystem.totalLength;

        this.nightGlowMaterials = [];
        this.crossingGates = [];
        this.crossingLights = [];
        this.crossingTimer = 0;

        this._createSharedMaterials();
        this._buildTerrainAndLake();
        this._buildCountryStation();
        this._buildLevelCrossing();
        this._buildInstancedTelegraphPoles();
        this._buildInstancedForestAndRocks();
        this._buildInstancedVillageCottages();
    }

    _createSharedMaterials() {
        // Procedural Lush Countryside Patchwork Terrain Texture
        const c = document.createElement('canvas');
        c.width = 512; c.height = 512;
        const g = c.getContext('2d');
        g.fillStyle = '#3b6e38';
        g.fillRect(0, 0, 512, 512);

        // Agricultural fields & meadow patches
        const hues = ['#346331', '#457a3f', '#528540', '#6d8c3c', '#2e572b'];
        for (let i = 0; i < 60; i++) {
            g.fillStyle = hues[i % hues.length];
            const px = (i * 97) % 512;
            const py = (i * 61) % 512;
            g.fillRect(px, py, 64 + (i % 48), 54 + (i % 40));
        }
        const terrainTex = new THREE.CanvasTexture(c);
        terrainTex.wrapS = THREE.RepeatWrapping;
        terrainTex.wrapT = THREE.RepeatWrapping;
        terrainTex.repeat.set(28, 28);

        // Cottage Wall + Glowing Window Texture
        const wDiff = document.createElement('canvas');
        wDiff.width = 128; wDiff.height = 128;
        const wg = wDiff.getContext('2d');
        wg.fillStyle = '#e5dcc8';
        wg.fillRect(0, 0, 128, 128);
        wg.fillStyle = '#5c4636';
        wg.fillRect(0, 112, 128, 16);
        wg.fillRect(54, 68, 20, 44); // Door

        const wEmis = document.createElement('canvas');
        wEmis.width = 128; wEmis.height = 128;
        const we = wEmis.getContext('2d');
        we.fillStyle = '#000000';
        we.fillRect(0, 0, 128, 128);

        [[18, 42], [86, 42]].forEach(([wx, wy]) => {
            wg.fillStyle = '#263545';
            wg.fillRect(wx, wy, 24, 26);
            we.fillStyle = '#ffd478';
            we.fillRect(wx + 2, wy + 2, 20, 22);
        });

        const cottageGlowMat = new THREE.MeshLambertMaterial({
            map: new THREE.CanvasTexture(wDiff),
            emissive: 0xffd478,
            emissiveMap: new THREE.CanvasTexture(wEmis),
            emissiveIntensity: 0.08
        });
        this.nightGlowMaterials.push(cottageGlowMat);

        const poleBulbMat = new THREE.MeshBasicMaterial({ color: 0x666055 });
        this.poleBulbMat = poleBulbMat;

        this.materials = {
            terrain: new THREE.MeshLambertMaterial({ map: terrainTex }),
            water: new THREE.MeshLambertMaterial({ color: 0x26658a, emissive: 0x091d2b }),
            woodPole: new THREE.MeshLambertMaterial({ color: GAME_CONFIG.colors.poleWood }),
            insulator: new THREE.MeshLambertMaterial({ color: GAME_CONFIG.colors.insulators }),
            wire: new THREE.LineBasicMaterial({ color: 0x22262a }),
            trunk: new THREE.MeshLambertMaterial({ color: 0x4a3828 }),
            pineFoliage: new THREE.MeshLambertMaterial({ color: 0x265429 }),
            oakFoliage: new THREE.MeshLambertMaterial({ color: 0x3b7334 }),
            bushFoliage: new THREE.MeshLambertMaterial({ color: 0x4e873c }),
            rock: new THREE.MeshLambertMaterial({ color: 0x6c7075 }),
            cottageWall: cottageGlowMat,
            cottageRoof: new THREE.MeshLambertMaterial({ color: 0x8c372b })
        };
    }

    _buildTerrainAndLake() {
        // Rolling countryside terrain with flat corridor around the Figure-8 track
        const groundGeo = new THREE.PlaneGeometry(3600, 3600, 72, 72);
        groundGeo.rotateX(-Math.PI / 2);

        const posArr = groundGeo.attributes.position.array;
        for (let i = 0; i < posArr.length; i += 3) {
            const x = posArr[i];
            const z = posArr[i + 2];
            const distFromCenterCorridor = Math.max(0, Math.abs(x) - 390);
            const hillFactor = Math.min(1.0, distFromCenterCorridor / 220.0);
            const h = (Math.sin(x * 0.0045) * Math.cos(z * 0.0045) * 18.0 +
                       Math.sin(x * 0.012 + z * 0.009) * 6.0) * hillFactor;
            posArr[i + 1] = Math.max(-0.25, h) - 0.25;
        }
        groundGeo.computeVertexNormals();

        const groundMesh = new THREE.Mesh(groundGeo, this.materials.terrain);
        this.scene.add(groundMesh);

        // Scenic Mirror Lake inside the South Loop (around x=0, z=680)
        const lakeGroup = new THREE.Group();
        const lakeMesh = new THREE.Mesh(
            new THREE.CircleGeometry(155, 32),
            this.materials.water
        );
        lakeMesh.rotation.x = -Math.PI / 2;
        lakeMesh.position.set(0, -0.08, 680);
        lakeGroup.add(lakeMesh);

        // Sandy shoreline ring
        const shoreMesh = new THREE.Mesh(
            new THREE.RingGeometry(150, 166, 32),
            new THREE.MeshLambertMaterial({ color: 0xa69576 })
        );
        shoreMesh.rotation.x = -Math.PI / 2;
        shoreMesh.position.set(0, -0.14, 680);
        lakeGroup.add(shoreMesh);

        // 4 Wooden Sailboats on the Lake
        const hullMat = new THREE.MeshLambertMaterial({ color: 0x4d321e });
        const sailMat = new THREE.MeshLambertMaterial({ color: 0xf5efe2, side: THREE.DoubleSide });
        [[-45, 640, 0.4], [50, 710, -1.1], [-20, 745, 2.1], [65, 650, 0.9]].forEach(([bx, bz, rot]) => {
            const boat = new THREE.Group();
            const hull = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 4.8), hullMat);
            hull.position.y = 0.2;
            boat.add(hull);
            const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 4.2, 6), hullMat);
            mast.position.y = 2.2;
            boat.add(mast);
            const sail = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3.4, 3), sailMat);
            sail.position.set(0, 2.3, 0.2);
            boat.add(sail);
            boat.position.set(bx, -0.05, bz);
            boat.rotation.y = rot;
            lakeGroup.add(boat);
        });

        this.scene.add(lakeGroup);
    }

    // Heritage Countryside Railway Station ("Greenlands Valley Junction")
    _buildCountryStation() {
        const uStation = 0.085;
        const pt = new THREE.Vector3();
        const tan = new THREE.Vector3();
        this.trackSystem.samplePoint(uStation, pt);
        this.trackSystem.sampleTangent(uStation, tan);

        const nx = -tan.z, nz = tan.x;
        const nLen = Math.hypot(nx, nz) || 1;
        const rx = nx / nLen, rz = nz / nLen;

        const stGroup = new THREE.Group();
        stGroup.position.set(pt.x + rx * 6.2, pt.y, pt.z + rz * 6.2);
        stGroup.rotation.y = Math.atan2(tan.x, tan.z);

        const platMat = new THREE.MeshLambertMaterial({ color: 0x878278 });
        const safetyLineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const wallMat = new THREE.MeshLambertMaterial({ color: 0xdfd3be });
        const roofMat = new THREE.MeshLambertMaterial({ color: 0x7c2d23 });
        const pillarMat = new THREE.MeshLambertMaterial({ color: 0x263847 });

        // Platform Base (56m long)
        const platform = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.85, 56), platMat);
        platform.position.set(0, 0.42, 0);
        stGroup.add(platform);

        // Yellow safety tactile line along track edge
        const yellowLine = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 55.6), safetyLineMat);
        yellowLine.position.set(-2.35, 0.86, 0);
        stGroup.add(yellowLine);

        // Canopy Roof & Pillars
        const canopy = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.25, 36), roofMat);
        canopy.position.set(-0.2, 4.3, 0);
        stGroup.add(canopy);

        for (let z = -15; z <= 15; z += 7.5) {
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.5, 8), pillarMat);
            post.position.set(-1.6, 2.55, z);
            stGroup.add(post);
        }

        // Main Brick & Timber Station Building
        const bldg = new THREE.Mesh(new THREE.BoxGeometry(6.5, 4.8, 22), this.materials.cottageWall);
        bldg.position.set(5.2, 2.8, 0);
        stGroup.add(bldg);

        const bldgRoof = new THREE.Mesh(new THREE.ConeGeometry(13.5, 2.8, 4), roofMat);
        bldgRoof.rotation.y = Math.PI / 4;
        bldgRoof.scale.set(0.55, 1, 1.25);
        bldgRoof.position.set(5.2, 6.6, 0);
        stGroup.add(bldgRoof);

        // Station Signboard ("GREENLANDS VALLEY")
        const sCanvas = document.createElement('canvas');
        sCanvas.width = 512; sCanvas.height = 96;
        const sg = sCanvas.getContext('2d');
        sg.fillStyle = '#143326';
        sg.fillRect(0, 0, 512, 96);
        sg.strokeStyle = '#e0b658';
        sg.lineWidth = 6;
        sg.strokeRect(4, 4, 504, 88);
        sg.fillStyle = '#f8fafc';
        sg.font = 'bold 34px sans-serif';
        sg.textAlign = 'center';
        sg.textBaseline = 'middle';
        sg.fillText('GREENLANDS JUNCTION', 256, 48);

        const signMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sCanvas) });
        const signBoard = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.95, 5.2), signMat);
        signBoard.position.set(-2.65, 4.5, 0);
        stGroup.add(signBoard);

        this.scene.add(stGroup);
    }

    // Animated Level Crossing with Red/White Barriers & Flashing Signal Lights
    _buildLevelCrossing() {
        this.crossingU = 0.24;
        const pt = new THREE.Vector3();
        const tan = new THREE.Vector3();
        this.trackSystem.samplePoint(this.crossingU, pt);
        this.trackSystem.sampleTangent(this.crossingU, tan);

        const crGroup = new THREE.Group();
        crGroup.position.copy(pt);
        crGroup.rotation.y = Math.atan2(tan.x, tan.z);

        // Asphalt Road Crossing
        const road = new THREE.Mesh(
            new THREE.BoxGeometry(36, 0.14, 7.2),
            new THREE.MeshLambertMaterial({ color: 0x33383e })
        );
        road.position.y = 0.08;
        crGroup.add(road);

        // Barrier Posts & Pivoting Gates
        const postMat = new THREE.MeshLambertMaterial({ color: 0x22262a });
        const gateMat = new THREE.MeshLambertMaterial({ color: 0xdc2626 });

        [[-4.2, -4.0, 1], [4.2, 4.0, -1]].forEach(([px, pz, dirSign]) => {
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 2.8, 8), postMat);
            post.position.set(px, 1.4, pz);
            crGroup.add(post);

            // Warning Lamp
            const lampMat = new THREE.MeshBasicMaterial({ color: 0x440a0a });
            const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), lampMat);
            lamp.position.set(px, 2.85, pz);
            crGroup.add(lamp);
            this.crossingLights.push(lampMat);

            // Pivoting Arm
            const pivot = new THREE.Group();
            pivot.position.set(px, 1.15, pz);
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 6.2), gateMat);
            arm.position.set(0, 0, -dirSign * 2.8);
            pivot.add(arm);
            crGroup.add(pivot);
            this.crossingGates.push({ pivot: pivot, dirSign: dirSign, angle: 0 });
        });

        this.scene.add(crGroup);
    }

    // 100% Instanced Telegraph Poles, Cross-Arms, Insulators & Bulbs (4 draw calls total instead of 600!)
    _buildInstancedTelegraphPoles() {
        const poleSpacing = 36.0;
        const count = Math.floor(this.trackLength / poleSpacing);

        const poleGeo = new THREE.CylinderGeometry(0.12, 0.16, 7.5, 7);
        const armGeo = new THREE.BoxGeometry(1.8, 0.12, 0.12);
        const bulbGeo = new THREE.SphereGeometry(0.16, 6, 6);

        const poleInst = new THREE.InstancedMesh(poleGeo, this.materials.woodPole, count);
        const armInst = new THREE.InstancedMesh(armGeo, this.materials.woodPole, count);
        const bulbInst = new THREE.InstancedMesh(bulbGeo, this.poleBulbMat, count);

        const dummy = new THREE.Object3D();
        const pt = new THREE.Vector3();
        const tan = new THREE.Vector3();
        const wirePoints = [];

        for (let i = 0; i < count; i++) {
            const u = (i * poleSpacing) / this.trackLength;
            this.trackSystem.samplePoint(u, pt);
            this.trackSystem.sampleTangent(u, tan);

            const nx = -tan.z, nz = tan.x;
            const nLen = Math.hypot(nx, nz) || 1;
            const rx = nx / nLen, rz = nz / nLen;

            const sideOffset = 7.8;
            const px = pt.x + rx * sideOffset;
            const pz = pt.z + rz * sideOffset;
            const py = pt.y + 3.6;
            const yaw = Math.atan2(tan.x, tan.z);

            dummy.position.set(px, py, pz);
            dummy.rotation.set(0, yaw, 0);
            dummy.scale.set(1, 1, 1);
            dummy.updateMatrix();
            poleInst.setMatrixAt(i, dummy.matrix);

            dummy.position.set(px, py + 3.2, pz);
            dummy.updateMatrix();
            armInst.setMatrixAt(i, dummy.matrix);

            dummy.position.set(px - rx * 0.85, py + 3.05, pz - rz * 0.85);
            dummy.updateMatrix();
            bulbInst.setMatrixAt(i, dummy.matrix);

            wirePoints.push(new THREE.Vector3(px - rx * 0.75, py + 3.25, pz - rz * 0.75));
        }
        // Close wire loop
        if (wirePoints.length > 0) wirePoints.push(wirePoints[0].clone());

        poleInst.instanceMatrix.needsUpdate = true;
        armInst.instanceMatrix.needsUpdate = true;
        bulbInst.instanceMatrix.needsUpdate = true;

        this.scene.add(poleInst, armInst, bulbInst);

        const wireGeo = new THREE.BufferGeometry().setFromPoints(wirePoints);
        this.scene.add(new THREE.Line(wireGeo, this.materials.wire));
    }

    // 100% Instanced Multi-Species Forest, Shrubs & Cliff Boulders (5 draw calls instead of 900+!)
    _buildInstancedForestAndRocks() {
        const pineCount = 320;
        const oakCount = 220;
        const bushCount = 260;
        const rockCount = 65;

        const trunkGeo = new THREE.CylinderGeometry(0.22, 0.42, 3.4, 6);
        const pineConeGeo = new THREE.ConeGeometry(2.3, 6.2, 7);
        const oakCrownGeo = new THREE.DodecahedronGeometry(2.6, 1);
        const bushGeo = new THREE.DodecahedronGeometry(1.2, 0);
        const rockGeo = new THREE.DodecahedronGeometry(3.2, 0);

        const trunkInst = new THREE.InstancedMesh(trunkGeo, this.materials.trunk, pineCount + oakCount);
        const pineInst = new THREE.InstancedMesh(pineConeGeo, this.materials.pineFoliage, pineCount);
        const oakInst = new THREE.InstancedMesh(oakCrownGeo, this.materials.oakFoliage, oakCount);
        const bushInst = new THREE.InstancedMesh(bushGeo, this.materials.bushFoliage, bushCount);
        const rockInst = new THREE.InstancedMesh(rockGeo, this.materials.rock, rockCount);

        const dummy = new THREE.Object3D();
        const pt = new THREE.Vector3();
        const tan = new THREE.Vector3();

        let tIdx = 0;

        // Deterministic pseudo-random helper
        const rand = (seed) => {
            const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
            return x - Math.floor(x);
        };

        // 1. Pines
        for (let i = 0; i < pineCount; i++) {
            const u = rand(i + 1);
            this.trackSystem.samplePoint(u, pt);
            this.trackSystem.sampleTangent(u, tan);
            const nx = -tan.z, nz = tan.x, nLen = Math.hypot(nx, nz) || 1;
            const side = rand(i + 500) < 0.5 ? -1 : 1;
            const dist = 15.0 + rand(i + 1000) * 95.0;
            const x = pt.x + (nx / nLen) * side * dist;
            const z = pt.z + (nz / nLen) * side * dist;

            // Strict track clearance (11.5m) and lake clearance
            if (Math.hypot(x, z - 680) < 168 || this.trackSystem.getMinDistanceToTrack(x, z) < 11.5) {
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                trunkInst.setMatrixAt(tIdx++, dummy.matrix);
                pineInst.setMatrixAt(i, dummy.matrix);
                continue;
            }

            const sc = 0.75 + rand(i + 1500) * 0.65;
            dummy.position.set(x, 1.6 * sc, z);
            dummy.rotation.set(0, rand(i) * Math.PI, 0);
            dummy.scale.set(sc, sc, sc);
            dummy.updateMatrix();
            trunkInst.setMatrixAt(tIdx++, dummy.matrix);

            dummy.position.set(x, 5.0 * sc, z);
            dummy.updateMatrix();
            pineInst.setMatrixAt(i, dummy.matrix);
        }

        // 2. Deciduous Oaks
        for (let i = 0; i < oakCount; i++) {
            const s = i + 3000;
            const u = rand(s);
            this.trackSystem.samplePoint(u, pt);
            this.trackSystem.sampleTangent(u, tan);
            const nx = -tan.z, nz = tan.x, nLen = Math.hypot(nx, nz) || 1;
            const side = rand(s + 200) < 0.5 ? -1 : 1;
            const dist = 14.0 + rand(s + 400) * 85.0;
            const x = pt.x + (nx / nLen) * side * dist;
            const z = pt.z + (nz / nLen) * side * dist;

            // Strict track clearance (11.5m) and lake clearance
            if (Math.hypot(x, z - 680) < 168 || this.trackSystem.getMinDistanceToTrack(x, z) < 11.5) {
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                trunkInst.setMatrixAt(tIdx++, dummy.matrix);
                oakInst.setMatrixAt(i, dummy.matrix);
                continue;
            }

            const sc = 0.8 + rand(s + 600) * 0.6;
            dummy.position.set(x, 1.6 * sc, z);
            dummy.rotation.set(0, rand(s) * Math.PI, 0);
            dummy.scale.set(sc, sc, sc);
            dummy.updateMatrix();
            trunkInst.setMatrixAt(tIdx++, dummy.matrix);

            dummy.position.set(x, 4.4 * sc, z);
            dummy.scale.set(sc * 1.15, sc * 0.9, sc * 1.15);
            dummy.updateMatrix();
            oakInst.setMatrixAt(i, dummy.matrix);
        }

        // 3. Trackside Bushes
        for (let i = 0; i < bushCount; i++) {
            const s = i + 6000;
            const u = rand(s);
            this.trackSystem.samplePoint(u, pt);
            this.trackSystem.sampleTangent(u, tan);
            const nx = -tan.z, nz = tan.x, nLen = Math.hypot(nx, nz) || 1;
            const side = rand(s + 100) < 0.5 ? -1 : 1;
            const dist = 7.5 + rand(s + 200) * 28.0;

            const z = pt.z + (nz / nLen) * side * dist;

            // Strict clearance: bushes never on rails
            if (this.trackSystem.getMinDistanceToTrack(x, z) < 6.5) {
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                bushInst.setMatrixAt(i, dummy.matrix);
                continue;
            }

            const sc = 0.6 + rand(s + 300) * 0.7;
            dummy.position.set(x, 0.5 * sc, z);
            dummy.rotation.set(0, rand(s) * Math.PI, 0);
            dummy.scale.set(sc * 1.2, sc * 0.8, sc * 1.2);
            dummy.updateMatrix();
            bushInst.setMatrixAt(i, dummy.matrix);
        }

        // 4. Cliff Boulders
        for (let i = 0; i < rockCount; i++) {
            const s = i + 9000;
            const u = rand(s);
            this.trackSystem.samplePoint(u, pt);
            this.trackSystem.sampleTangent(u, tan);
            const nx = -tan.z, nz = tan.x, nLen = Math.hypot(nx, nz) || 1;
            const side = rand(s + 50) < 0.5 ? -1 : 1;
            const dist = 18.0 + rand(s + 150) * 55.0;
            const x = pt.x + (nx / nLen) * side * dist;
            const z = pt.z + (nz / nLen) * side * dist;

            // Strict clearance: boulders never on track

                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                rockInst.setMatrixAt(i, dummy.matrix);
                continue;
            }

            const sx = 0.8 + rand(s + 10) * 1.4;
            const sy = 0.6 + rand(s + 20) * 1.2;
            const sz = 0.8 + rand(s + 30) * 1.4;
            dummy.position.set(x, sy * 1.1, z);
            dummy.rotation.set(rand(s) * 0.4, rand(s + 5) * Math.PI, rand(s + 9) * 0.4);
            dummy.scale.set(sx, sy, sz);
            dummy.updateMatrix();
            rockInst.setMatrixAt(i, dummy.matrix);
        }

        trunkInst.instanceMatrix.needsUpdate = true;
        pineInst.instanceMatrix.needsUpdate = true;
        oakInst.instanceMatrix.needsUpdate = true;
        bushInst.instanceMatrix.needsUpdate = true;
        rockInst.instanceMatrix.needsUpdate = true;

        this.scene.add(trunkInst, pineInst, oakInst, bushInst, rockInst);
    }

    // 100% Instanced Country Cottages with Night-Glowing Windows (2 draw calls instead of 70!)
    _buildInstancedVillageCottages() {
        const count = 42;
        const bodyGeo = new THREE.BoxGeometry(6.8, 4.4, 5.4);
        const roofGeo = new THREE.ConeGeometry(5.6, 2.4, 4);
        roofGeo.rotateY(Math.PI / 4);

        const bodyInst = new THREE.InstancedMesh(bodyGeo, this.materials.cottageWall, count);
        const roofInst = new THREE.InstancedMesh(roofGeo, this.materials.cottageRoof, count);

        const dummy = new THREE.Object3D();
        const pt = new THREE.Vector3();
        const tan = new THREE.Vector3();

        for (let i = 0; i < count; i++) {
            const u = ((i + 0.5) / count) % 1.0;
            // Avoid bridge center & station
            if (Math.abs(u - 0.085) < 0.03 || Math.abs(u - 0.52) < 0.04) {
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                bodyInst.setMatrixAt(i, dummy.matrix);
                roofInst.setMatrixAt(i, dummy.matrix);
                continue;
            }

            this.trackSystem.samplePoint(u, pt);
            this.trackSystem.sampleTangent(u, tan);
            const nx = -tan.z, nz = tan.x, nLen = Math.hypot(nx, nz) || 1;
            const side = (i % 2 === 0) ? 1 : -1;
            const dist = 24.0 + ((i * 19) % 32);

            const bx = pt.x + (nx / nLen) * side * dist;
            const bz = pt.z + (nz / nLen) * side * dist;
            // Strictly keep clear of tracks (min 22m safe corridor), lake, bridge, and station
            if (Math.hypot(bx, bz - 680) < 170 || this.trackSystem.getMinDistanceToTrack(bx, bz) < 22.0) {
                dummy.scale.set(0, 0, 0);
                dummy.updateMatrix();
                bodyInst.setMatrixAt(i, dummy.matrix);
                roofInst.setMatrixAt(i, dummy.matrix);
                continue;
            }

            const yaw = Math.atan2(tan.x, tan.z) + (side > 0 ? -Math.PI * 0.5 : Math.PI * 0.5);
            const sc = 0.9 + (i % 4) * 0.12;

            dummy.position.set(bx, 2.2 * sc, bz);
            dummy.rotation.set(0, yaw, 0);
            dummy.scale.set(sc, sc, sc);
            dummy.updateMatrix();
            bodyInst.setMatrixAt(i, dummy.matrix);

            dummy.position.set(bx, (4.4 + 1.1) * sc, bz);
            dummy.updateMatrix();
            roofInst.setMatrixAt(i, dummy.matrix);
        }

        bodyInst.instanceMatrix.needsUpdate = true;
        roofInst.instanceMatrix.needsUpdate = true;
        this.scene.add(bodyInst, roofInst);
    }

    setNightFactor(windowGlowIntensity, isNightOrSunset) {
        for (let i = 0; i < this.nightGlowMaterials.length; i++) {
            this.nightGlowMaterials[i].emissiveIntensity = windowGlowIntensity;
        }
        if (this.poleBulbMat) {
            this.poleBulbMat.color.setHex(isNightOrSunset ? 0xffe082 : 0x666055);
        }
    }

    update(trainProgress, dt) {
        // Animate level crossing gates & flashing lights when train is near crossingU (0.24)
        let dU = Math.abs(trainProgress - this.crossingU);
        if (dU > 0.5) dU = 1.0 - dU;
        const trainNear = dU < 0.045;

        const targetAngle = trainNear ? 0.0 : (Math.PI * 0.45);
        for (let i = 0; i < this.crossingGates.length; i++) {
            const g = this.crossingGates[i];
            g.angle += (targetAngle - g.angle) * Math.min(1.0, (dt || 0.016) * 4.5);
            g.pivot.rotation.x = g.dirSign * g.angle;
        }

        if (trainNear) {
            this.crossingTimer += (dt || 0.016) * 8.0;
            const flash = Math.sin(this.crossingTimer) > 0;
            if (this.crossingLights.length >= 2) {
                this.crossingLights[0].color.setHex(flash ? 0xff2222 : 0x330505);
                this.crossingLights[1].color.setHex(!flash ? 0xff2222 : 0x330505);
            }
        } else {
            for (let i = 0; i < this.crossingLights.length; i++) {
                this.crossingLights[i].color.setHex(0x330505);
            }
        }
    }
}
